<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Peer Chat</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080a0f;color:#f4f7fb;font-family:system-ui,sans-serif;padding:14px}.wrap{max-width:1050px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.top h1{margin:0;font-size:30px}.sub{color:#8993a2;font-size:12px}.pill{padding:8px 12px;border:1px solid #303744;border-radius:999px;background:#11151d;font-size:11px}.grid{display:grid;grid-template-columns:280px 1fr;gap:14px}.panel{background:#10141b;border:1px solid #292f39;border-radius:17px;padding:15px}.label{font-size:11px;color:#9da7b5;margin:10px 0 6px;display:block}input,textarea{width:100%;background:#090d13;color:#fff;border:1px solid #343c49;border-radius:10px;padding:10px;font:inherit;outline:0}textarea{resize:none;min-height:52px}.btn{border:1px solid #394250;background:#1a202a;color:#fff;border-radius:10px;padding:10px 13px;font-weight:700;cursor:pointer}.primary{background:#dce6f2;color:#080b10}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.room{font-size:11px;color:#aab4c2;line-height:1.5;margin-top:12px}.chat{height:calc(100vh - 155px);min-height:450px;display:flex;flex-direction:column}.messages{flex:1;overflow:auto;padding:4px}.msg{max-width:82%;padding:10px 12px;border-radius:13px;background:#1a202a;margin:7px 0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}.mine{margin-left:auto;background:#dce6f2;color:#080b10}.meta{font-size:9px;opacity:.6;margin-bottom:3px}.media{max-width:100%;border-radius:10px;margin-top:5px}.composer{display:flex;gap:8px;margin-top:8px}.composer textarea{flex:1}.status{font-size:10px;color:#7f8998;margin-top:8px;min-height:14px}@media(max-width:720px){.grid{grid-template-columns:1fr}.chat{height:70vh}.top h1{font-size:24px}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div><h1>Peer Chat</h1><div class="sub">Direct browser-to-browser room chat</div></div><div class="pill" id="state">Offline</div></div>
<div class="grid">
<section class="panel">
<label class="label">Your name</label><input id="name" maxlength="30" placeholder="Name">
<label class="label">Room code</label><input id="room" maxlength="40" placeholder="Make a room code">
<div class="buttons"><button class="btn primary" id="host">Create room</button><button class="btn" id="join">Join room</button></div>
<div class="buttons"><button class="btn" id="copy">Copy invite</button><button class="btn" id="leave">Leave</button></div>
<div class="room" id="info">Create or join a room. Messages are sent directly between connected browsers and are not written to this site's storage.</div>
<label class="label">Media</label><input id="file" type="file" accept="image/*,video/*">
<div class="status" id="status"></div>
</section>
<section class="panel chat">
<div class="messages" id="messages"></div>
<div class="composer"><textarea id="input" placeholder="Message everyone…"></textarea><button class="btn primary" id="send">Send</button></div>
<div class="buttons"><button class="btn" id="call">Start video call</button><button class="btn" id="hang">End call</button></div>
<div id="videos" style="display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px"></div>
</section>
</div>
</div>
<script>
const $=x=>document.getElementById(x),pc={},channels=new Map();
let localStream=null,roomCode='',connected=false;
function say(t,mine=false,media=null){const d=document.createElement('div');d.className='msg'+(mine?' mine':'');d.innerHTML='<div class="meta">'+(mine?'You':t.name||'Peer')+'</div>';if(media){if(media.type.startsWith('image/')){const i=document.createElement('img');i.className='media';i.src=media.url;d.appendChild(i)}else{const v=document.createElement('video');v.className='media';v.controls=true;v.src=media.url;d.appendChild(v)}}else d.append(document.createTextNode(t.text||t));$('messages').appendChild(d);$('messages').scrollTop=$('messages').scrollHeight}
function status(t){$('status').textContent=t}
function signalKey(){return 'peer-chat-signal-'+roomCode}
function sendSignal(x){const k=signalKey();const a=JSON.parse(sessionStorage.getItem(k)||'[]');a.push({...x,from:crypto.randomUUID(),at:Date.now()});sessionStorage.setItem(k,JSON.stringify(a))}
function pollSignal(){if(!roomCode)return;const k=signalKey();let a=JSON.parse(sessionStorage.getItem(k)||'[]');const mine=JSON.parse(sessionStorage.getItem('peer-chat-seen-'+roomCode)||'[]');const fresh=a.filter(x=>!mine.includes(x.from));if(fresh.length){sessionStorage.setItem('peer-chat-seen-'+roomCode,JSON.stringify([...mine,...fresh.map(x=>x.from)].slice(-200)));fresh.forEach(handleSignal)}}
async function makePeer(id,initiator){const p=new RTCPeerConnection();pc[id]=p;if(localStream)localStream.getTracks().forEach(t=>p.addTrack(t,localStream));p.onicecandidate=e=>{if(e.candidate)sendSignal({kind:'ice',to:id,data:e.candidate})};p.ontrack=e=>{let v=document.getElementById('v-'+id);if(!v){v=document.createElement('video');v.id='v-'+id;v.autoplay=true;v.playsInline=true;v.className='media';$('videos').appendChild(v)}v.srcObject=e.streams[0]};p.onconnectionstatechange=()=>{if(p.connectionState==='failed'||p.connectionState==='closed')p.close()};if(initiator){const o=await p.createOffer();await p.setLocalDescription(o);sendSignal({kind:'offer',to:id,data:o})}return p}
async function handleSignal(x){if(x.to&&x.to!==$('name').value)return;if(x.kind==='offer'){const id=x.from;const p=await makePeer(id,false);await p.setRemoteDescription(x.data);const a=await p.createAnswer();await p.setLocalDescription(a);sendSignal({kind:'answer',to:id,data:a})}else if(x.kind==='answer'){const p=pc[x.from];if(p)await p.setRemoteDescription(x.data)}else if(x.kind==='ice'){const p=pc[x.from];if(p)try{await p.addIceCandidate(x.data)}catch(e){}}}
function roomStart(){if(!roomCode)return;connected=true;$('state').textContent='In room';status('Connected locally. Nothing is saved by this page.');setInterval(pollSignal,700)}
$('host').onclick=()=>{roomCode=$('room').value.trim()||Math.random().toString(36).slice(2,8);$('room').value=roomCode;roomStart();status('Room created. Share the invite with friends.')};
$('join').onclick=()=>{roomCode=$('room').value.trim();if(!roomCode)return status('Enter a room code');roomStart();sendSignal({kind:'join',to:null});status('Joined room. Waiting for peers…')};
$('copy').onclick=async()=>{if(!roomCode)return status('Create or join a room first');await navigator.clipboard.writeText(location.href.split('#')[0]+'#room='+encodeURIComponent(roomCode));status('Invite copied')};
$('leave').onclick=()=>{Object.values(pc).forEach(p=>p.close());location.reload()};
$('send').onclick=()=>{const text=$('input').value.trim();if(!text)return;$('input').value='';say({text},true);for(const p of Object.values(pc))if(p.dataChannel?.readyState==='open')p.dataChannel.send(JSON.stringify({kind:'text',name:$('name').value,text}))};
$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('send').click()}});
$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;if(f.size>12*1024*1024)return status('Media is limited to 12 MB per file');const data=await f.arrayBuffer();for(const p of Object.values(pc))if(p.dataChannel?.readyState==='open')p.dataChannel.send(JSON.stringify({kind:'media',name:$('name').value,type:f.type,data:[...new Uint8Array(data)]}));status('Media sent directly to connected peers');e.target.value=''};
$('call').onclick=async()=>{try{localStream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});for(const p of Object.values(pc)){localStream.getTracks().forEach(t=>p.addTrack(t,localStream));const o=await p.createOffer();await p.setLocalDescription(o);sendSignal({kind:'offer',to:null,data:o})}status('Camera and microphone enabled for the peer call')}catch(e){status('Camera/microphone permission was not granted')}};
$('hang').onclick=()=>{if(localStream){localStream.getTracks().forEach(t=>t.stop());localStream=null}Object.values(pc).forEach(p=>p.close());$('videos').innerHTML='';status('Call ended')};
function setupChannels(p,id){const dc=p.createDataChannel('chat');p.dataChannel=dc;dc.onmessage=e=>receive(e,id);p.ondatachannel=e=>{p.dataChannel=e.channel;e.channel.onmessage=q=>receive(q,id)}}
function receive(e,id){try{const x=JSON.parse(e.data);if(x.kind==='text')say(x);if(x.kind==='media'){const blob=new Blob([new Uint8Array(x.data)],{type:x.type});say(x,false,{type:x.type,url:URL.createObjectURL(blob)})}}catch{}}
$('name').value=localStorage.getItem('peer-chat-name')||'';$('name').oninput=()=>localStorage.setItem('peer-chat-name',$('name').value);
if(location.hash.startsWith('#room=')){$('room').value=decodeURIComponent(location.hash.slice(6));$('info').textContent='Invite room detected. Enter your name, then join.'}
</script>
</body>
</html>
