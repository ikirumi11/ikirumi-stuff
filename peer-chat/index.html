<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Peer Chat</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080a0f;color:#f4f7fb;font-family:system-ui,sans-serif;padding:14px}.wrap{max-width:1050px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.top h1{margin:0;font-size:30px}.sub{color:#8993a2;font-size:12px}.pill{padding:8px 12px;border:1px solid #303744;border-radius:999px;background:#11151d;font-size:11px}.grid{display:grid;grid-template-columns:280px 1fr;gap:14px}.panel{background:#10141b;border:1px solid #292f39;border-radius:17px;padding:15px}.label{font-size:11px;color:#9da7b5;margin:10px 0 6px;display:block}input,textarea{width:100%;background:#090d13;color:#fff;border:1px solid #343c49;border-radius:10px;padding:10px;font:inherit;outline:0}textarea{resize:none;min-height:52px}.btn{border:1px solid #394250;background:#1a202a;color:#fff;border-radius:10px;padding:10px 13px;font-weight:700;cursor:pointer}.primary{background:#dce6f2;color:#080b10}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.room{font-size:11px;color:#aab4c2;line-height:1.5;margin-top:12px}.chat{height:calc(100vh - 155px);min-height:450px;display:flex;flex-direction:column}.messages{flex:1;overflow:auto;padding:4px}.msg{max-width:82%;padding:10px 12px;border-radius:13px;background:#1a202a;margin:7px 0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}.mine{margin-left:auto;background:#dce6f2;color:#080b10}.meta{font-size:9px;opacity:.6;margin-bottom:3px}.media{max-width:100%;border-radius:10px;margin-top:5px}.composer{display:flex;gap:8px;margin-top:8px}.composer textarea{flex:1}.status{font-size:10px;color:#7f8998;margin-top:8px;min-height:14px}@media(max-width:720px){.grid{grid-template-columns:1fr}.chat{height:70vh}.top h1{font-size:24px}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div><h1>Peer Chat</h1><div class="sub">One public peer-to-peer chat · automatic connection</div></div><div class="pill" id="state">Connecting…</div></div>
<div class="grid">
<section class="panel">
<label class="label">Your name</label><input id="name" maxlength="30" placeholder="Name">
<div class="room" id="info">Everyone uses the same public chat. No room code or invite is needed.</div>
<label class="label">Media</label><input id="file" type="file" accept="image/*,video/*">
<div class="status" id="status">Starting peer connection…</div>
</section>
<section class="panel chat">
<div class="messages" id="messages"></div>
<div class="composer"><textarea id="input" placeholder="Message everyone…"></textarea><button class="btn primary" id="send">Send</button></div>
<div class="buttons"><button class="btn" id="call">Start video call</button><button class="btn" id="hang">End call</button></div>
<div id="videos" style="display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px"></div>
</section>
</div>
</div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const $=x=>document.getElementById(x);
const BOOTSTRAP='ikirumi-bootstrap-peer-v2';
let peer=null,connections=new Map(),knownPeers=new Set(),mediaCalls=new Map(),localStream=null,starting=false;
const name=()=>($('name').value.trim()||'Anonymous').slice(0,30);
function status(t){$('status').textContent=t}
function say(author,text,media=null,mine=false){const d=document.createElement('div');d.className='msg'+(mine?' mine':'');const meta=document.createElement('div');meta.className='meta';meta.textContent=mine?'You':author;d.appendChild(meta);if(media){const el=media.type.startsWith('image/')?document.createElement('img'):document.createElement('video');el.className='media';el.src=media.url;if(el.tagName==='VIDEO'){el.controls=true;el.playsInline=true}d.appendChild(el)}else d.appendChild(document.createTextNode(text));$('messages').appendChild(d);$('messages').scrollTop=$('messages').scrollHeight}
function sendTo(c,data){try{if(c&&c.open)c.send(data)}catch{}}
function broadcast(data,except=''){connections.forEach((c,id)=>{if(id!==except)sendTo(c,data)})}
function remember(id){if(id&&id!==peer?.id&&id!==BOOTSTRAP)knownPeers.add(id)}
function connectTo(id){if(!id||id===peer?.id)return;if(connections.has(id)&&connections.get(id).open)return;if(!peer||peer.destroyed)return;remember(id);const c=peer.connect(id,{reliable:true,metadata:{name:name()}});setupConn(c)}
function connectKnown(){[...knownPeers].forEach(connectTo)}
function announceSelf(){broadcast({kind:'peer-list',peers:[peer.id,...knownPeers]})}
function announceBootstrap(){try{const b=peer.connect(BOOTSTRAP,{reliable:true});b.on('open',()=>{b.send({kind:'bootstrap',id:peer.id,peers:[...knownPeers]})});b.on('data',x=>{if(x?.kind==='bootstrap-list'){(x.peers||[]).forEach(remember);connectKnown();announceSelf()}})}catch{}}
function setupConn(c){
if(!c||c.peer===peer?.id)return;
const old=connections.get(c.peer);
if(old&&old!==c){try{old.close()}catch{}}
connections.set(c.peer,c);
remember(c.peer);
c.on('open',()=>{sendTo(c,{kind:'hello',id:peer.id,name:name(),peers:[...knownPeers]});$('state').textContent='Online';status('Connected · automatically linked to the public chat');connectKnown();announceSelf()});
c.on('data',x=>receive(x,c.peer));
c.on('close',()=>{if(connections.get(c.peer)===c)connections.delete(c.peer);setTimeout(()=>connectTo(c.peer),1200);updateState()});
c.on('error',()=>{if(connections.get(c.peer)===c)connections.delete(c.peer);setTimeout(()=>connectTo(c.peer),2500);updateState()});
}
function receive(x,from){
if(!x||typeof x!=='object')return;
if(x.kind==='bootstrap'){(x.peers||[]).forEach(remember);remember(x.id);sendTo(connections.get(from),{kind:'bootstrap-list',peers:[peer.id,...knownPeers]});connectKnown();return}
if(x.kind==='hello'){remember(x.id);(x.peers||[]).forEach(remember);connectKnown();sendTo(connections.get(from),{kind:'peer-list',peers:[peer.id,...knownPeers]});return}
if(x.kind==='peer-list'){(x.peers||[]).forEach(remember);connectKnown();return}
if(x.kind==='text'){say(x.name,x.text);broadcast(x,from);return}
if(x.kind==='media'){const blob=new Blob([x.data],{type:x.type});say(x.name,'',{type:x.type,url:URL.createObjectURL(blob)});broadcast(x,from)}
}
function updateState(){const count=[...connections.values()].filter(c=>c.open).length;$('state').textContent=count?'Online · '+count+' peers':'Reconnecting…'}
function makePeer(){
if(starting)return;
starting=true;
try{if(peer&&!peer.destroyed)peer.destroy()}catch{}
peer=new Peer();
peer.on('open',id=>{starting=false;status('Finding peers automatically…');announceBootstrap();connectKnown()});
peer.on('connection',setupConn);
peer.on('call',async call=>{
if(!localStream){try{localStream=await navigator.mediaDevices.getUserMedia({video:true,audio:true})}catch{return}}
call.answer(localStream);showCall(call);
});
peer.on('disconnected',()=>{status('Signaling connection lost · reconnecting…');try{peer.reconnect()}catch{}});
peer.on('close',()=>{starting=false;setTimeout(makePeer,1500)});
peer.on('error',e=>{
starting=false;
if(e.type==='peer-unavailable'||e.type==='network'||e.type==='server-error'||e.type==='socket-error'||e.type==='socket-closed'){status('Peer unavailable · retrying automatically…');setTimeout(()=>{if(peer&&!peer.destroyed){try{peer.reconnect()}catch{}}announceBootstrap();connectKnown()},2000);return}
status('Reconnecting automatically…');
if(e.type!=='unavailable-id')setTimeout(makePeer,1800);
});
}
function showCall(call){mediaCalls.set(call.peer,call);call.on('stream',s=>{let v=document.getElementById('v-'+call.peer);if(!v){v=document.createElement('video');v.id='v-'+call.peer;v.autoplay=true;v.playsInline=true;v.className='media';$('videos').appendChild(v)}v.srcObject=s});call.on('close',()=>{const v=document.getElementById('v-'+call.peer);if(v)v.remove();mediaCalls.delete(call.peer)})}
$('send').onclick=()=>{const text=$('input').value.trim();if(!text)return;$('input').value='';const x={kind:'text',name:name(),text};say('',text,null,true);broadcast(x)};
$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('send').click()}});
$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;if(f.size>8*1024*1024){status('Media is limited to 8 MB per file');e.target.value='';return}const buf=await f.arrayBuffer();const x={kind:'media',name:name(),type:f.type,data:buf};broadcast(x);say('', '',{type:f.type,url:URL.createObjectURL(new Blob([buf],{type:f.type}))},true);status('Media sent directly to connected peers');e.target.value=''};
$('call').onclick=async()=>{try{if(!localStream)localStream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});connections.forEach(c=>{if(c.open){const call=peer.call(c.peer,localStream);showCall(call)}});status('Video call started with connected peers')}catch{status('Camera/microphone permission was not granted')}};
$('hang').onclick=()=>{mediaCalls.forEach(c=>c.close());mediaCalls.clear();if(localStream){localStream.getTracks().forEach(t=>t.stop());localStream=null}$('videos').innerHTML='';status('Call ended')};
setInterval(()=>{if(peer&&!peer.destroyed){if(peer.disconnected){try{peer.reconnect()}catch{}}announceBootstrap();connectKnown()}},5000);
setInterval(updateState,2000);
makePeer();
</script>
</body>
</html>
