<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080a0f"><title>Infinite Games</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#080a0f;color:#f5f7fb;font-family:system-ui,-apple-system,Segoe UI,sans-serif}body{padding:14px}.wrap{max-width:1050px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.head h1{margin:0;font-size:clamp(27px,6vw,42px)}.head p{margin:4px 0;color:#7f8998;font-size:12px}.badge{border:1px solid #303744;background:#11151d;padding:8px 11px;border-radius:999px;font-size:11px;color:#aeb8c7}.games{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.game{border:1px solid #292f39;background:#10141b;border-radius:13px;padding:11px;color:#fff;text-align:left;cursor:pointer}.game b{display:block}.game span{font-size:10px;color:#808a99}.game.active{border-color:#dce6f2;background:#181e27}.box{margin-top:12px;border:1px solid #292f39;background:#10141b;border-radius:17px;padding:12px}.bar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px}.bar h2{font-size:16px;margin:0}.stats{font-size:11px;color:#9da7b5}.canvasWrap{position:relative;width:100%;height:min(68vh,650px);min-height:390px;border-radius:13px;overflow:hidden;background:#05070a}.canvasWrap canvas{display:block;width:100%;height:100%;touch-action:none}.controls{display:flex;justify-content:center;gap:8px;margin-top:10px}.btn{border:1px solid #394250;background:#1a202a;color:#fff;border-radius:10px;padding:10px 15px;font-weight:700;cursor:pointer}.hint{text-align:center;color:#707b8a;font-size:10px;margin-top:7px}.touch{display:none}@media(max-width:800px){.games{grid-template-columns:repeat(2,1fr)}.game:last-child{grid-column:span 2}.canvasWrap{min-height:330px}.touch{display:flex;position:absolute;inset:auto 12px 12px;justify-content:space-between;pointer-events:none}.touch button{pointer-events:auto;width:58px;height:58px;border-radius:50%;border:1px solid #596474;background:#111827d9;color:#fff;font-size:22px}}@media(min-width:801px){.touch{display:none}}
</style>
</head>
<body><div class="wrap"><div class="head"><div><h1>∞ Infinite Games</h1><p>Five endless games. No levels. No final screen.</p></div><div class="badge" id="badge">5 games</div></div><div class="games"><button class="game active" data-game="runner"><b>Neon Runner</b><span>Jump forever</span></button><button class="game" data-game="asteroids"><b>Asteroid Drift</b><span>Survive the field</span></button><button class="game" data-game="dots"><b>Dot Collector</b><span>Grow your score</span></button><button class="game" data-game="snake"><b>Snake∞</b><span>Endless grid</span></button><button class="game" data-game="dodge"><b>Orbit Dodge</b><span>Dodge forever</span></button></div><div class="box"><div class="bar"><h2 id="title">Neon Runner</h2><div class="stats" id="stats">Score 0 · Best 0</div></div><div class="canvasWrap"><canvas id="c"></canvas><div class="touch" id="touch"></div></div><div class="controls"><button class="btn" id="start">Start / Restart</button></div><div class="hint" id="hint">Space / tap to jump</div></div></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),title=document.getElementById('title'),stats=document.getElementById('stats'),hint=document.getElementById('hint'),start=document.getElementById('start'),touch=document.getElementById('touch');let W,H,game='runner',running=false,last=0,score=0,best=Number(localStorage.getItem('infinite-games-best')||0),keys={},objects=[],player={},raf=0;
function resize(){const r=c.getBoundingClientRect(),d=devicePixelRatio||1;W=r.width;H=r.height;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();
function rand(a,b){return a+Math.random()*(b-a)}function reset(){cancelAnimationFrame(raf);score=0;objects=[];running=true;last=performance.now();if(game==='runner')player={x:W*.16,y:H*.7,vy:0,r:18,ground:H*.78};if(game==='asteroids')player={x:W/2,y:H/2,a:0,vx:0,vy:0,r:13};if(game==='dots')player={x:W/2,y:H/2,r:15};if(game==='snake')player={body:[{x:Math.floor(W/2/24)*24,y:Math.floor(H/2/24)*24}],dir:{x:1,y:0},next:{x:1,y:0},timer:0,food:null};if(game==='dodge')player={a:0,r:75,x:W/2,y:H/2};setup();loop(last)}
function setup(){const names={runner:['Neon Runner','Space / tap to jump'],asteroids:['Asteroid Drift','WASD / arrows to steer · Space to thrust'],dots:['Dot Collector','Move with mouse or touch'],snake:['Snake∞','Arrows / WASD · eat dots'],dodge:['Orbit Dodge','Move around the orbit · avoid blocks']};title.textContent=names[game][0];hint.textContent=names[game][1];document.querySelectorAll('.game').forEach(b=>b.classList.toggle('active',b.dataset.game===game));touch.innerHTML='';if(game==='snake'||game==='asteroids')touch.innerHTML='<button data-k="left">◀</button><button data-k="up">▲</button><button data-k="down">▼</button><button data-k="right">▶</button>';updateStats()}
function updateStats(){stats.textContent='Score '+Math.floor(score)+' · Best '+best}
function end(){running=false;best=Math.max(best,Math.floor(score));localStorage.setItem('infinite-games-best',best);updateStats();x.fillStyle='#ffffff';x.textAlign='center';x.font='700 25px system-ui';x.fillText('Game over',W/2,H/2-8);x.font='13px system-ui';x.fillText('Press Start / Restart',W/2,H/2+20)}
function circle(o){x.beginPath();x.arc(o.x,o.y,o.r,0,Math.PI*2);x.fill()}
function loop(t){if(!running)return;const dt=Math.min(.035,(t-last)/1000);last=t;update(dt);draw();updateStats();raf=requestAnimationFrame(loop)}
function update(dt){score+=dt*(game==='snake'?.5:1);if(game==='runner')runner(dt);if(game==='asteroids')asteroids(dt);if(game==='dots')dots(dt);if(game==='snake')snake(dt);if(game==='dodge')dodge(dt)}
function runner(dt){player.vy+=1500*dt;player.y+=player.vy*dt;if(player.y>=player.ground-player.r){player.y=player.ground-player.r;player.vy=0;player.ground=true}else player.ground=false;if(!objects.length||objects[objects.length-1].x<W*.65)objects.push({x:W+30,y:player.ground-25-rand(0,30),w:rand(18,34),h:rand(25,55)});objects.forEach(o=>o.x-=300*dt*(1+score/700));objects=objects.filter(o=>o.x>-60);for(const o of objects)if(player.x+player.r>o.x&&player.x-player.r<o.x+o.w&&player.y+player.r>o.y-o.h){end();return}}
function asteroids(dt){let ax=(keys.ArrowLeft||keys.a?-1:0)+(keys.ArrowRight||keys.d?1:0),th=(keys.ArrowUp||keys.w);player.a+=ax*3*dt;if(th){player.vx+=Math.cos(player.a)*180*dt;player.vy+=Math.sin(player.a)*180*dt}player.vx*=.995;player.vy*=.995;player.x=(player.x+player.vx*dt+W)%W;player.y=(player.y+player.vy*dt+H)%H;if(Math.random()<dt*(.8+score/500))objects.push({x:Math.random()*W,y:-20,r:rand(12,30),vx:rand(-60,60),vy:rand(50,140)});objects.forEach(o=>{o.x=(o.x+o.vx*dt+W)%W;o.y+=o.vy*dt});for(const o of objects){if(Math.hypot(o.x-player.x,o.y-player.y)<o.r+player.r){end();return}}objects=objects.filter(o=>o.y<H+50)}
function dots(dt){const sp=300;let dx=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0),dy=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0);player.x=Math.max(player.r,Math.min(W-player.r,player.x+dx*sp*dt));player.y=Math.max(player.r,Math.min(H-player.r,player.y+dy*sp*dt));if(!objects.length)objects.push({x:rand(25,W-25),y:rand(25,H-25),r:10});for(const o of objects)if(Math.hypot(o.x-player.x,o.y-player.y)<o.r+player.r){score+=20;objects=[]}}
function snake(dt){player.timer+=dt;if(!player.food)player.food={x:Math.floor(rand(1,W/24-1))*24,y:Math.floor(rand(1,H/24-1))*24};if(player.timer<.105)return;player.timer=0;player.dir=player.next;let h={x:player.body[0].x+player.dir.x*24,y:player.body[0].y+player.dir.y*24};if(h.x<0||h.x>=W||h.y<0||h.y>=H||player.body.some(b=>b.x===h.x&&b.y===h.y)){end();return}player.body.unshift(h);if(Math.hypot(h.x-player.food.x,h.y-player.food.y)<10){score+=30;player.food=null}else player.body.pop()}
function dodge(dt){player.a+=(keys.ArrowLeft||keys.a?-1:0)+(keys.ArrowRight||keys.d?1:0);player.x=W/2+Math.cos(player.a)*player.r;player.y=H/2+Math.sin(player.a)*player.r;if(!objects.length||objects[objects.length-1].t>1.2)objects.push({a:Math.random()*6.28,t:0,r:rand(15,25)});objects.forEach(o=>o.t+=dt);for(const o of objects){const rr=20+o.t*65,ox=W/2+Math.cos(o.a)*rr,oy=H/2+Math.sin(o.a)*rr;if(Math.hypot(ox-player.x,oy-player.y)<o.r+10){end();return}}objects=objects.filter(o=>o.t<5)}
function draw(){x.clearRect(0,0,W,H);x.fillStyle='#0a0d13';x.fillRect(0,0,W,H);x.fillStyle='#dce6f2';if(game==='runner'){x.fillRect(0,player.ground,W,3);x.fillRect(player.x-player.r,player.y-player.r,player.r*2,player.r*2);objects.forEach(o=>x.fillRect(o.x,o.y-o.h,o.w,o.h))}if(game==='asteroids'){objects.forEach(o=>{x.beginPath();x.arc(o.x,o.y,o.r,0,7);x.fill()});x.save();x.translate(player.x,player.y);x.rotate(player.a);x.beginPath();x.moveTo(20,0);x.lineTo(-14,-11);x.lineTo(-9,0);x.lineTo(-14,11);x.closePath();x.fill();x.restore()}if(game==='dots'){objects.forEach(circle);circle(player)}if(game==='snake'){player.body.forEach(circle);if(player.food)circle(player.food)}if(game==='dodge'){x.beginPath();x.arc(W/2,H/2,player.r,0,7);x.strokeStyle='#384352';x.stroke();circle(player);objects.forEach(o=>{const rr=20+o.t*65;x.beginPath();x.arc(W/2+Math.cos(o.a)*rr,H/2+Math.sin(o.a)*rr,o.r,0,7);x.fill()})}}
addEventListener('keydown',e=>{keys[e.key]=true;if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();if(game==='runner'&&e.key===' '&&running&&player.ground){player.vy=-650}if((e.key==='Enter'||e.key===' ')&&!running)reset();if(game==='snake'){if(e.key==='ArrowUp'||e.key==='w')player.next={x:0,y:-1};if(e.key==='ArrowDown'||e.key==='s')player.next={x:0,y:1};if(e.key==='ArrowLeft'||e.key==='a')player.next={x:-1,y:0};if(e.key==='ArrowRight'||e.key==='d')player.next={x:1,y:0}}});addEventListener('keyup',e=>keys[e.key]=false);c.addEventListener('pointerdown',e=>{if(game==='runner'&&running&&player.ground)player.vy=-650;if(game==='dots'&&running){const r=c.getBoundingClientRect();player.x=e.clientX-r.left;player.y=e.clientY-r.top}});c.addEventListener('pointermove',e=>{if(game==='dots'&&running){const r=c.getBoundingClientRect();player.x=e.clientX-r.left;player.y=e.clientY-r.top}});start.onclick=reset;document.querySelectorAll('.game').forEach(b=>b.onclick=()=>{game=b.dataset.game;running=false;setup();draw()});touch.addEventListener('pointerdown',e=>{const k=e.target.dataset.k;if(!k)return;keys[k==='left'?'ArrowLeft':k==='right'?'ArrowRight':k==='up'?'ArrowUp':'ArrowDown']=true});touch.addEventListener('pointerup',()=>{for(const k of ['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'])keys[k]=false});setup();draw();
</script></body></html>
