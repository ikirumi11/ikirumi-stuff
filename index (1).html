<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Shared Gallery</title>
  <link rel="stylesheet" href="./styles.css" />
  <script type="importmap">
    {
      "imports": {
        "nipplejs": "https://esm.sh/nipplejs@0.9.0",
        "jszip": "https://esm.sh/jszip@3.10.0"
      }
    }
  </script>
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">✦</span>
        <span>Shared Gallery</span>
      </div>
      <div class="header-actions">
        <div id="userInfo" class="user-status muted">connecting...</div>
        <button id="copyLinkBtn" class="secondary-button" type="button">Copy link</button>
      </div>
    </header>

    <main>
      <section class="join" aria-label="Join a gallery">
        <input id="codeInput" placeholder="Enter a gallery code" autocomplete="off" />
        <button id="joinBtn" type="button">Open gallery <span aria-hidden="true">→</span></button>
      </section>

      <section id="controls" class="hidden">
        <div class="gallery-context row">
          <label class="small">Gallery code</label>
          <div id="currentCode" class="codeLabel">—</div>
        </div>

        <div class="toolbar row">
          <!-- Tabs -->
          <div id="tabs" aria-label="Gallery content">
            <button id="tabMedia" class="active" type="button">Media</button>
            <button id="tabFiles" type="button">Files</button>
          </div>

          <div style="flex:1"></div>

          <label class="small">Sort:</label>
          <select id="filterSelect" aria-label="Gallery sort">
            <option value="new">Newest → Oldest</option>
            <option value="old">Oldest → Newest</option>
          </select>
        </div>

        <div id="mediaControls" style="display:flex; flex-direction:column; gap:10px;">
          <div class="upload-row row">
            <input id="fileInput" type="file" accept="image/*,video/*,text/plain" multiple />
            <button id="uploadBtn" disabled type="button">Upload</button>
            <button id="manualAddBtn" class="secondary-button" type="button">Add URL</button>
          </div>

          <div class="row" style="align-items:center">
            <label class="small">Show:</label>
            <div style="display:flex;gap:8px;align-items:center">
              <label style="display:inline-flex;align-items:center;gap:6px" title="Toggle images">
                <input id="toggleImages" type="checkbox" checked /> Images
              </label>
              <label style="display:inline-flex;align-items:center;gap:6px" title="Toggle videos">
                <input id="toggleVideos" type="checkbox" checked /> Videos
              </label>
              <label style="display:inline-flex;align-items:center;gap:6px" title="Cover items with their spoiler number until opened fullscreen">
                <input id="spoileeToggle" type="checkbox" checked /> Spoilers
              </label>
            </div>
            <div style="flex:1"></div>
          </div>
        </div>

        <div class="actions-row row">
          <button id="downloadAllBtn" class="secondary-button" type="button">Download all</button>
          <div class="action-spacer"></div>
          <button id="leaveBtn" class="quiet-danger" type="button">Leave</button>
          <button id="removeAllBtn" class="danger" type="button">Remove all</button>
        </div>
      </section>

      <section id="galleryWrap" class="hidden">
        <button id="scrollUp" class="scroll-btn scroll-up" aria-label="Scroll up">▲</button>
        <div id="gallery" class="grid" tabindex="0" aria-label="Image gallery"></div>
        <button id="scrollDown" class="scroll-btn scroll-down" aria-label="Scroll down">▼</button>
        <div id="empty" class="muted">No images in this gallery yet.</div>
      </section>

      <section id="filesWrap" class="hidden" aria-label="Shared files">
        <div class="files-toolbar">
          <button id="filesBackBtn" class="secondary-button icon-only" type="button" aria-label="Back to parent folder">←</button>
          <nav id="fileBreadcrumbs" class="file-breadcrumbs" aria-label="Folder path"></nav>
          <div class="file-toolbar-spacer"></div>
          <button id="newFolderBtn" class="secondary-button" type="button">New folder</button>
          <label for="fileUploadInput" class="file-upload-button">Upload files</label>
          <input id="fileUploadInput" type="file" multiple hidden />
        </div>
        <div id="fileDropZone" class="file-drop-zone">
          <div class="file-drop-icon" aria-hidden="true">↥</div>
          <div><strong>Drop files here</strong><span>or use Upload files</span></div>
        </div>
        <div class="files-heading"><span>Name</span><span>Added</span><span>Size</span><span></span></div>
        <div id="filesList" class="files-list"></div>
        <div id="emptyFiles" class="muted empty-files">This folder is empty.</div>
      </section>
    </main>

    <footer class="muted small">
      All data is saved online and synchronized with everyone sharing the same code.
    </footer>
  </div>

  <!-- Fullscreen viewer modal -->
  <div id="viewer" class="hidden">
    <button id="viewerClose" class="viewer-btn viewer-close" aria-label="Close">✕</button>
    <button id="viewerPrev" class="viewer-btn viewer-prev" aria-label="Previous">◀</button>
    <div id="viewerInner" class="viewer-inner">
      <img id="viewerImg" src="" alt="" style="display:none" />
      <video id="viewerVideo" src="" controls style="max-width:90vw; max-height:80vh; display:none; border-radius:6px; background:#000"></video>
    </div>
    <button id="viewerNext" class="viewer-btn viewer-next" aria-label="Next">▶</button>

  </div>

  <div id="toast" class="hidden toast" role="status" aria-live="polite"></div>

  <script type="module" src="./app.js"></script>
</body>
</html>
