<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Random Media</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080a0f;color:#f4f7fb;font-family:system-ui,sans-serif;padding:18px}.wrap{max-width:1100px;margin:auto}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:16px}.title h1{margin:0;font-size:30px}.sub{color:#8993a2;font-size:12px;margin-top:4px}.pill{background:#11151d;border:1px solid #303744;border-radius:999px;padding:8px 12px;font-size:11px}.panel{background:#10141b;border:1px solid #292f39;border-radius:18px;padding:15px;margin-bottom:14px}.controls{display:grid;grid-template-columns:1fr auto;gap:9px}.select{width:100%;background:#090d13;color:#fff;border:1px solid #343c49;border-radius:11px;padding:11px;font:inherit}.btn{border:1px solid #394250;background:#1a202a;color:#fff;border-radius:11px;padding:11px 16px;font-weight:750;cursor:pointer}.primary{background:#dce6f2;color:#080b10}.random{width:100%;font-size:16px;padding:14px;margin-top:10px}.layout{display:grid;grid-template-columns:310px 1fr;gap:14px}.list{max-height:65vh;overflow:auto}.item{padding:9px 10px;border-bottom:1px solid #202630;font-size:12px;word-break:break-word}.folder{color:#aab7c8}.file{color:#e7edf5}.viewer{min-height:65vh;display:flex;align-items:center;justify-content:center;background:#090d13;border-radius:13px;overflow:hidden;position:relative}.viewer img,.viewer video{max-width:100%;max-height:65vh;display:block}.empty{color:#778294;text-align:center;padding:30px}.path{font-size:11px;color:#8e99a8;margin-top:8px;word-break:break-all}.status{font-size:11px;color:#8e99a8;margin-top:9px;min-height:15px}@media(max-width:760px){.layout{grid-template-columns:1fr}.list{max-height:30vh}.viewer{min-height:48vh}.viewer img,.viewer video{max-height:48vh}.controls{grid-template-columns:1fr}.top{align-items:flex-start}.title h1{font-size:25px}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div class="title"><h1>Random Media</h1><div class="sub">Choose a folder on your device. Images and videos inside all subfolders are included.</div></div><div class="pill" id="count">0 media</div></div>
<div class="panel">
<div class="controls"><button class="btn primary" id="choose">Choose device folder</button><button class="btn" id="clear">Clear</button></div>
<button class="btn primary random" id="random">Random</button>
<div class="path" id="path"></div><div class="status" id="status">Choose a folder to begin.</div>
</div>
<div class="layout"><div class="panel list" id="list"><div class="empty">No folder selected.</div></div><div class="panel viewer" id="viewer"><div class="empty">Your random image or video will appear here.</div></div></div>
</div>
<script>
const $=id=>document.getElementById(id);
const imageExt=['jpg','jpeg','png','gif','webp','bmp','svg','avif'];
const videoExt=['mp4','webm','mov','m4v','ogg','mkv'];
let files=[];
function ext(n){return n.split('.').pop().toLowerCase()}
function isMedia(f){return imageExt.includes(ext(f.name))||videoExt.includes(ext(f.name))}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function chooseFolder(){
const input=document.createElement('input');
input.type='file';input.webkitdirectory=true;input.multiple=true;
input.onchange=()=>{
files=[...input.files].filter(isMedia);
$('count').textContent=files.length+' media';
if(!files.length){$('list').innerHTML='<div class="empty">No supported images or videos found.</div>';$('status').textContent='No supported media found.';return}
const root=input.files[0]?.webkitRelativePath?.split('/')[0]||'Selected folder';
$('path').textContent=root+' · all nested folders included';
$('list').innerHTML=files.map(f=>'<div class="item file">'+esc(f.webkitRelativePath||f.name)+'</div>').join('');
$('status').textContent='Loaded '+files.length+' images/videos from your device.';
showRandom();
};
input.click();
}
function showRandom(){
if(!files.length){$('status').textContent='Choose a device folder first.';return}
const f=files[Math.floor(Math.random()*files.length)],url=URL.createObjectURL(f),e=ext(f.name);
$('viewer').innerHTML='';
if(videoExt.includes(e)){const v=document.createElement('video');v.src=url;v.controls=true;v.autoplay=true;v.loop=true;v.playsInline=true;$('viewer').appendChild(v)}
else{const i=document.createElement('img');i.src=url;i.alt=f.name;$('viewer').appendChild(i)}
$('path').textContent=f.webkitRelativePath||f.name;
$('status').textContent='Randomly selected '+f.name;
}
function clearAll(){files=[];$('count').textContent='0 media';$('path').textContent='';$('status').textContent='Choose a folder to begin.';$('list').innerHTML='<div class="empty">No folder selected.</div>';$('viewer').innerHTML='<div class="empty">Your random image or video will appear here.</div>'}
$('choose').onclick=chooseFolder;
$('random').onclick=showRandom;
$('clear').onclick=clearAll;
</script>
</body>
</html>
