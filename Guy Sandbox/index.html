<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Guy Sandbox</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101216;color:#fff;font-family:system-ui,sans-serif;touch-action:none}#app{width:100%;height:100%;display:flex;flex-direction:column}.top{height:58px;display:flex;align-items:center;gap:7px;padding:7px 9px;background:#181b21;border-bottom:1px solid #292e37;z-index:8}.title{font-weight:900;font-size:18px;margin-right:auto}.tool,.select{border:1px solid #343b47;background:#222730;color:#fff;border-radius:9px;padding:8px 10px;font-weight:700}.tool:active,.item:active{transform:scale(.96)}#game{display:block;width:100%;height:calc(100% - 58px);background:#cbd5df}.panel{position:fixed;left:8px;right:8px;bottom:8px;display:flex;gap:7px;align-items:center;overflow-x:auto;padding:8px;background:rgba(19,22,28,.95);border:1px solid #343a45;border-radius:14px;z-index:7}.item{min-width:62px;height:58px;border:1px solid #3b4350;border-radius:10px;background:#252b34;color:#fff;font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}.item span{font-size:22px}.item.selected{border-color:#fff;background:#303844}.hint{position:fixed;top:66px;left:50%;transform:translateX(-50%);background:rgba(20,23,29,.82);padding:6px 10px;border-radius:8px;font-size:11px;pointer-events:none;z-index:3;white-space:nowrap}.count{position:fixed;right:10px;top:66px;background:rgba(20,23,29,.82);padding:6px 9px;border-radius:8px;font-size:11px;z-index:3}.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:20}.box{width:min(620px,calc(100% - 24px));max-height:80vh;overflow:auto;background:#181b21;border:1px solid #343b47;border-radius:16px;padding:15px}.box h2{margin:0 0 12px}.maps{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.map{padding:14px;border:1px solid #3b4350;background:#242a33;color:#fff;border-radius:11px;text-align:left;font-weight:800}.close{float:right}.danger{color:#ffb4b4}.freeze{color:#b9d4ff}@media(min-width:700px){.panel{left:50%;right:auto;transform:translateX(-50%);width:min(900px,calc(100% - 16px));justify-content:center}.hint{font-size:12px}.maps{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div id="app">
<div class="top"><div class="title">Guy Sandbox</div><button class="tool" id="mapBtn">Maps</button><button class="tool" id="pause">Pause</button><button class="tool freeze" id="freeze">Freeze</button><button class="tool" id="reset">Reset</button><button class="tool danger" id="clear">Delete All</button></div>
<canvas id="game"></canvas><div class="hint">Drag, throw, connect, freeze and break things</div><div class="count" id="count">0 objects</div>
<div class="panel" id="panel"></div>
<div class="modal" id="modal"><div class="box"><button class="tool close" id="close">Close</button><h2>Choose Map</h2><div class="maps" id="maps"></div></div></div>
</div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),panel=document.getElementById('panel'),count=document.getElementById('count'),modal=document.getElementById('modal'),mapsEl=document.getElementById('maps');
let W=0,H=0,dpr=1,paused=false,objects=[],joints=[],drag=null,last=performance.now(),selected='guy',toolMode='spawn',zoom=1,camera={x:0,y:0},pan=null;
const G=820;
const types={
guy:{name:'Ragdoll',icon:'🧍',w:24,h:46,m:1,shape:'ragdoll'},
box:{name:'Box',icon:'⬛',w:38,h:38,m:2,shape:'box'},
ball:{name:'Ball',icon:'⚪',w:24,h:24,m:1,shape:'circle'},
heavy:{name:'Heavy',icon:'🧱',w:52,h:28,m:6,shape:'box'},
crate:{name:'Crate',icon:'📦',w:48,h:42,m:3,shape:'box'},
metal:{name:'Metal',icon:'🔩',w:42,h:42,m:8,shape:'box'},
platform:{name:'Wall',icon:'▬',w:130,h:18,m:0,shape:'box',static:true},
rope:{name:'Rope',icon:'🪢',w:1,h:1,m:0,tool:'rope'},
weld:{name:'Weld',icon:'🔗',w:1,h:1,m:0,tool:'weld'},
delete:{name:'Delete',icon:'🗑️',w:1,h:1,m:0,tool:'delete'}
};
for(const [id,t] of Object.entries(types)){const b=document.createElement('button');b.className='item'+(id===selected?' selected':'');b.innerHTML='<span>'+t.icon+'</span>'+t.name;b.onpointerdown=e=>{e.preventDefault();selected=id;toolMode=t.tool||'spawn';document.querySelectorAll('.item').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};panel.appendChild(b)}
function resize(){const r=canvas.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;canvas.width=W*dpr;canvas.height=H*dpr}addEventListener('resize',resize);resize();
function screen(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function world(p){return{x:(p.x-W/2)/zoom+W/2+camera.x,y:(p.y-H/2)/zoom+H/2+camera.y}}
function add(type,x,y){const t=types[type];const o={id:crypto.randomUUID(),type,x,y,vx:0,vy:0,w:t.w,h:t.h,angle:0,va:0,static:!!t.static,frozen:false};if(type==='guy'){o.parts=[];const parts=[['head',0,-25,13,13,0.5],['body',0,0,17,25,1],['arm',-23,2,9,28,.5],['arm',23,2,9,28,.5],['leg',-9,31,10,29,.7],['leg',9,31,10,29,.7]];for(const p of parts)o.parts.push({type:p[0],x:x+p[1],y:y+p[2],w:p[3],h:p[4],m:p[5],vx:0,vy:0,a:0,va:0,frozen:false});}objects.push(o);updateCount();return o}
function updateCount(){count.textContent=objects.length+' objects • '+joints.length+' joints'}
function inside(o,p){if(o.type==='guy'){for(const q of o.parts)if(Math.abs(p.x-q.x)<q.w/2+5&&Math.abs(p.y-q.y)<q.h/2+5)return true;return Math.hypot(p.x-o.x,p.y-o.y)<30}if(o.shape==='circle')return Math.hypot(p.x-o.x,p.y-o.y)<o.w*.65;return Math.abs(p.x-o.x)<o.w/2&&Math.abs(p.y-o.y)<o.h/2}
function nearest(p){let best=null,bd=Infinity;for(const o of objects){if(o.type==='guy'){for(const q of o.parts){let d=Math.hypot(p.x-q.x,p.y-q.y);if(d<bd){bd=d;best={o,part:q}}}}else{let d=Math.hypot(p.x-o.x,p.y-o.y);if(d<bd){bd=d;best={o}}}}return bd<55?best:null}
function act(a,b){if(!a||!b||a===b)return;if(!joints.some(j=>(j.a===a.id&&j.b===b.id)||(j.a===b.id&&j.b===a.id)))joints.push({id:crypto.randomUUID(),a:a.id,b:b.id,type:toolMode,dist:Math.max(20,Math.hypot(a.x-b.x,a.y-b.y))});updateCount()}
function remove(o){if(!o)return;objects=objects.filter(x=>x!==o);joints=joints.filter(j=>j.a!==o.id&&j.b!==o.id);updateCount()}
function pointerDown(e){canvas.setPointerCapture(e.pointerId);const p=world(screen(e));if(e.button===1){pan={x:e.clientX,y:e.clientY,cx:camera.x,cy:camera.y};return}if(toolMode==='delete'){const n=nearest(p);if(n)remove(n.o);return}const n=nearest(p);if(toolMode==='rope'||toolMode==='weld'){if(!window.link){window.link=n?.o||null}else{act(window.link,n?.o);window.link=null}return}if(n){drag=n.o;drag.grabX=p.x-drag.x;drag.grabY=p.y-drag.y;drag.pointer=true;return}if(selected&&types[selected].tool)return;drag=add(selected,p.x,p.y);drag.grabX=0;drag.grabY=0;drag.pointer=true}
canvas.addEventListener('pointerdown',pointerDown);
canvas.addEventListener('pointermove',e=>{if(pan){camera.x=pan.cx-(e.clientX-pan.x)/zoom;camera.y=pan.cy-(e.clientY-pan.y)/zoom;return}if(!drag)return;const p=world(screen(e));drag.x=p.x-drag.grabX;drag.y=p.y-drag.grabY;drag.vx=0;drag.vy=0});
canvas.addEventListener('pointerup',()=>{if(pan)pan=null;if(drag){drag.pointer=false;drag.vx*=1.8;drag.vy*=1.8;drag=null}});
canvas.addEventListener('wheel',e=>{e.preventDefault();const before=world(screen(e));zoom=Math.max(.35,Math.min(2.8,zoom*Math.pow(1.0015,-e.deltaY)));const after=world(screen(e));camera.x+=before.x-after.x;camera.y+=before.y-after.y});
function bodyParts(o){return o.type==='guy'?o.parts:[o]}
function integratePart(q,dt){if(q.frozen)return;q.vy+=G*dt;q.vx*=.999;q.vy*=.999;q.x+=q.vx*dt;q.y+=q.vy*dt}
function solveJoint(j){const a=objects.find(o=>o.id===j.a),b=objects.find(o=>o.id===j.b);if(!a||!b)return;let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||.001;if(j.type==='weld'){const midx=(a.x+b.x)/2,midy=(a.y+b.y)/2;if(!a.frozen&&!a.static){a.x=midx-dx*.5;a.y=midy-dy*.5}if(!b.frozen&&!b.static){b.x=midx+dx*.5;b.y=midy+dy*.5}a.vx=b.vx=(a.vx+b.vx)/2;a.vy=b.vy=(a.vy+b.vy)/2}else{const err=d-j.dist,nx=dx/d,ny=dy/d;const move=err*.5;if(!a.frozen&&!a.static){a.x+=nx*move;a.y+=ny*move}if(!b.frozen&&!b.static){b.x-=nx*move;b.y-=ny*move}}}
function collide(a,b){if(a.static&&b.static)return;const aa=bodyParts(a),bb=bodyParts(b);for(const x of aa)for(const y of bb){if(x===y||x.frozen&&y.frozen)continue;const dx=y.x-x.x,dy=y.y-x.y,ox=(x.w+y.w)/2-Math.abs(dx),oy=(x.h+y.h)/2-Math.abs(dy);if(ox>0&&oy>0){if(ox<oy){const nx=Math.sign(dx)||1;if(!x.frozen&&!a.static)x.x-=nx*ox*.5;if(!y.frozen&&!b.static)y.x+=nx*ox*.5;const av=x.vx*nx,bv=y.vx*nx;if(av-bv>0){const imp=-(1.25)*(av-bv)/(1/x.m+1/y.m);if(!x.frozen)x.vx+=imp/x.m*nx;if(!y.frozen)y.vx-=imp/y.m*nx}}else{const ny=Math.sign(dy)||1;if(!x.frozen&&!a.static)x.y-=ny*oy*.5;if(!y.frozen&&!b.static)y.y+=ny*oy*.5;const av=x.vy*ny,bv=y.vy*ny;if(av-bv>0){const imp=-1.25*(av-bv)/(1/x.m+1/y.m);if(!x.frozen)x.vy+=imp/x.m*ny;if(!y.frozen)y.vy-=imp/y.m*ny}}}}}
function step(dt){if(paused)return;for(const o of objects){if(o.pointer||o.frozen||o.static)continue;if(o.type==='guy'){for(const p of o.parts)integratePart(p,dt);o.x=o.parts[1].x;o.y=o.parts[1].y}else integratePart(o,dt);if(o.type!=='guy'){const hw=o.w/2,hh=o.h/2;if(o.x-hw<0){o.x=hw;o.vx=Math.abs(o.vx)*.45}if(o.x+hw>W){o.x=W-hw;o.vx=-Math.abs(o.vx)*.45}if(o.y-hh<0){o.y=hh;o.vy=Math.abs(o.vy)*.45}if(o.y+hh>H){o.y=H-hh;o.vy=-Math.abs(o.vy)*.38;o.vx*=.97}}else for(const p of o.parts){if(p.x-p.w/2<0){p.x=p.w/2;p.vx=Math.abs(p.vx)*.4}if(p.x+p.w/2>W){p.x=W-p.w/2;p.vx=-Math.abs(p.vx)*.4}if(p.y+p.h/2>H){p.y=H-p.h/2;p.vy=-Math.abs(p.vy)*.25;p.vx*=.97}}}for(let k=0;k<5;k++){for(let i=0;i<objects.length;i++)for(let j=i+1;j<objects.length;j++)collide(objects[i],objects[j]);for(const j of joints)solveJoint(j)}}
function draw(){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);ctx.save();ctx.translate(W/2,H/2);ctx.scale(zoom,zoom);ctx.translate(-W/2-camera.x,-H/2-camera.y);ctx.fillStyle='#d7e0e8';ctx.fillRect(camera.x,camera.y,W,H);ctx.fillStyle='#9aa8b5';ctx.fillRect(camera.x,camera.y+H-3,W,3);for(const j of joints){const a=objects.find(o=>o.id===j.a),b=objects.find(o=>o.id===j.b);if(a&&b){ctx.strokeStyle=j.type==='weld'?'#ffb43b':'#d7e3ee';ctx.lineWidth=j.type==='weld'?5:2;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}}for(const o of objects){ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.angle);if(o.type==='guy'){for(const p of o.parts){ctx.save();ctx.translate(p.x-o.x,p.y-o.y);ctx.fillStyle=p.type==='head'?'#e4b08a':'#52647b';ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.strokeStyle='#303844';ctx.strokeRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore()}}else if(o.shape==='circle'){ctx.beginPath();ctx.arc(0,0,o.w/2,0,Math.PI*2);ctx.fillStyle='#f4f6f8';ctx.fill();ctx.strokeStyle='#59636f';ctx.stroke()}else{ctx.fillStyle=o.type==='platform'?'#4e5966':o.type==='metal'?'#6e7883':o.type==='heavy'?'#717b86':o.type==='crate'?'#b07b43':'#8793a0';ctx.fillRect(-o.w/2,-o.h/2,o.w,o.h);ctx.strokeStyle='#414b57';ctx.strokeRect(-o.w/2,-o.h/2,o.w,o.h)}if(o.frozen){ctx.strokeStyle='#79b7ff';ctx.lineWidth=3;ctx.strokeRect(-o.w/2-3,-o.h/2-3,o.w+6,o.h+6)}ctx.restore()}ctx.restore();if(paused){ctx.fillStyle='rgba(0,0,0,.28)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.font='700 26px system-ui';ctx.textAlign='center';ctx.fillText('PAUSED',W/2,H/2)}}
const mapDefs=[['Garage','flat',3],['Warehouse','warehouse',4],['Tower','tower',6],['Pit','pit',5],['Playground','play',7]];
function loadMap(name){objects=[];joints=[];zoom=1;camera={x:0,y:0};const def=mapDefs.find(x=>x[0]===name)||mapDefs[0];if(def[1]==='flat'){add('platform',W/2,H-55);add('platform',W/2-220,H-150);add('platform',W/2+220,H-260)}if(def[1]==='warehouse'){add('platform',W/2,H-55);add('platform',100,H/2);add('platform',W-100,H/2);add('platform',W/2,H/2)}if(def[1]==='tower'){add('platform',W/2,H-55);for(let i=1;i<6;i++)add('platform',W/2+(i%2?130:-130),H-55-i*85)}if(def[1]==='pit'){add('platform',W/2-260,H-55);add('platform',W/2+260,H-55);add('platform',W/2-150,H-220);add('platform',W/2+150,H-220);add('platform',W/2,H-390)}if(def[1]==='play'){add('platform',W/2,H-55);for(let i=0;i<7;i++)add('platform',100+i*(W-200)/6,H-120-Math.sin(i)*30)}for(let i=0;i<def[2];i++)add(i%3===0?'guy':i%3===1?'box':'ball',W/2-120+i*55,100+i*10);updateCount();modal.style.display='none'}
for(const m of mapDefs){const b=document.createElement('button');b.className='map';b.textContent=m[0];b.onclick=()=>loadMap(m[0]);mapsEl.appendChild(b)}
document.getElementById('mapBtn').onclick=()=>modal.style.display='flex';document.getElementById('close').onclick=()=>modal.style.display='none';document.getElementById('pause').onclick=()=>{paused=!paused;document.getElementById('pause').textContent=paused?'Resume':'Pause'};document.getElementById('freeze').onclick=()=>{const p=world({x:W/2,y:H/2});const n=nearest(p);if(n)n.o.frozen=!n.o.frozen};document.getElementById('clear').onclick=()=>{objects=[];joints=[];updateCount()};document.getElementById('reset').onclick=()=>loadMap('Garage');
resize();loadMap('Garage');requestAnimationFrame(function loop(t){const dt=Math.min((t-last)/1000,.025);last=t;step(dt);draw();requestAnimationFrame(loop)});
</script>
</body>
</html>
