<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Guy Sandbox</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101216;color:#fff;font-family:system-ui,sans-serif;touch-action:none}#app{width:100%;height:100%;display:flex;flex-direction:column}.top{height:58px;display:flex;align-items:center;gap:10px;padding:8px 12px;background:#181b21;border-bottom:1px solid #292e37;z-index:5}.title{font-weight:800;font-size:18px;margin-right:auto}.tool{border:1px solid #343b47;background:#222730;color:#fff;border-radius:10px;padding:9px 12px;font-weight:700}.tool:active{transform:scale(.96)}#game{display:block;width:100%;height:calc(100% - 58px);background:#cbd5df}.panel{position:fixed;left:10px;right:10px;bottom:10px;display:flex;gap:8px;align-items:center;overflow-x:auto;padding:9px;background:rgba(19,22,28,.94);border:1px solid #343a45;border-radius:15px;z-index:4}.item{min-width:70px;height:62px;border:1px solid #3b4350;border-radius:11px;background:#252b34;color:#fff;font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}.item span{font-size:24px}.item.selected{border-color:#fff;background:#303844}.hint{position:fixed;top:68px;left:50%;transform:translateX(-50%);background:rgba(20,23,29,.8);padding:7px 11px;border-radius:9px;font-size:12px;pointer-events:none;z-index:3;white-space:nowrap}.count{position:fixed;right:12px;top:68px;background:rgba(20,23,29,.8);padding:7px 10px;border-radius:9px;font-size:12px;z-index:3}.clear{color:#ffb4b4}.pause{color:#c9d5ff}@media(min-width:700px){.panel{left:50%;right:auto;transform:translateX(-50%);width:min(720px,calc(100% - 20px));justify-content:center}.hint{font-size:13px}}
</style>
</head>
<body>
<div id="app"><div class="top"><div class="title">Guy Sandbox</div><button class="tool pause" id="pause">Pause</button><button class="tool" id="reset">Reset</button><button class="tool clear" id="clear">Clear</button></div><canvas id="game"></canvas><div class="hint">Drag an item from the bottom into the world</div><div class="count" id="count">0 objects</div><div class="panel" id="panel"></div></div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),panel=document.getElementById('panel'),count=document.getElementById('count');
let W=0,H=0,dpr=1,paused=false,objects=[],drag=null,last=performance.now(),selected='guy';
const types={guy:{name:'Guy',icon:'🧍',w:22,h:44,m:1,shape:'box'},box:{name:'Box',icon:'⬛',w:38,h:38,m:2,shape:'box'},ball:{name:'Ball',icon:'⚪',w:22,h:22,m:1,shape:'circle'},heavy:{name:'Heavy',icon:'🧱',w:48,h:26,m:5,shape:'box'},crate:{name:'Crate',icon:'📦',w:48,h:42,m:3,shape:'box'},platform:{name:'Platform',icon:'▬',w:110,h:16,m:0,shape:'box',static:true}};
for(const [id,t] of Object.entries(types)){const b=document.createElement('button');b.className='item'+(id===selected?' selected':'');b.innerHTML='<span>'+t.icon+'</span>'+t.name;b.onpointerdown=e=>{e.preventDefault();selected=id;document.querySelectorAll('.item').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};panel.appendChild(b)}
function resize(){const r=canvas.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();
function add(type,x,y){const t=types[type];objects.push({type,x,y,vx:0,vy:0,w:t.w,h:t.h,angle:0,va:0,static:!!t.static});updateCount()}
function updateCount(){count.textContent=objects.length+' object'+(objects.length===1?'':'s')}
function pos(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function inside(o,p){if(o.shape==='circle')return Math.hypot(p.x-o.x,p.y-o.y)<o.w*.7;return Math.abs(p.x-o.x)<o.w/2&&Math.abs(p.y-o.y)<o.h/2}
function spawnFromScreen(x,y){add(selected,x,y);drag=objects[objects.length-1];drag.grabX=x-drag.x;drag.grabY=y-drag.y;drag.pointer=true}
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);const p=pos(e);for(let i=objects.length-1;i>=0;i--)if(inside(objects[i],p)){drag=objects[i];drag.grabX=p.x-drag.x;drag.grabY=p.y-drag.y;drag.pointer=true;return}spawnFromScreen(p.x,p.y)});
canvas.addEventListener('pointermove',e=>{if(!drag)return;const p=pos(e);drag.x=p.x-drag.grabX;drag.y=p.y-drag.grabY;drag.vx=0;drag.vy=0});
canvas.addEventListener('pointerup',e=>{if(drag){drag.pointer=false;drag.vx=0;drag.vy=0;drag=null}});
function collide(a,b){if(a.static&&b.static)return;if(a.shape==='circle'&&b.shape==='circle'){let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||.001,r=(a.w+b.w)/2;if(d<r){let nx=dx/d,ny=dy/d,over=r-d;if(!a.static){a.x-=nx*over*(b.static?1:.5);a.y-=ny*over*(b.static?1:.5)}if(!b.static){b.x+=nx*over*(a.static?1:.5);b.y+=ny*over*(a.static?1:.5)}resolve(a,b,nx,ny)}}else{const ax=a.w/2,ay=a.h/2,bx=b.w/2,by=b.h/2,dx=b.x-a.x,dy=b.y-a.y,ox=ax+bx-Math.abs(dx),oy=ay+by-Math.abs(dy);if(ox>0&&oy>0){if(ox<oy){const nx=Math.sign(dx)||1;if(!a.static)a.x-=nx*ox*(b.static?1:.5);if(!b.static)b.x+=nx*ox*(a.static?1:.5);resolve(a,b,nx,0)}else{const ny=Math.sign(dy)||1;if(!a.static)a.y-=ny*oy*(b.static?1:.5);if(!b.static)b.y+=ny*oy*(a.static?1:.5);resolve(a,b,0,ny)}}}}
function resolve(a,b,nx,ny){const av=a.vx*nx+a.vy*ny,bv=b.vx*nx+b.vy*ny;if(av-bv<=0)return;const e=.35,imp=-(1+e)*(av-bv)/(1/a.m+1/b.m);if(!a.static){a.vx+=(imp/a.m)*nx;a.vy+=(imp/a.m)*ny}if(!b.static){b.vx-=(imp/b.m)*nx;b.vy-=(imp/b.m)*ny}}
function step(dt){if(paused)return;for(const o of objects){if(o.pointer||o.static)continue;o.vy+=650*dt;o.vx*=.999;o.vy*=.999;o.x+=o.vx*dt;o.y+=o.vy*dt;if(o.shape==='circle'){const r=o.w/2;if(o.x-r<0){o.x=r;o.vx=Math.abs(o.vx)*.45}if(o.x+r>W){o.x=W-r;o.vx=-Math.abs(o.vx)*.45}if(o.y-r<0){o.y=r;o.vy=Math.abs(o.vy)*.45}if(o.y+r>H-2){o.y=H-r-2;o.vy=-Math.abs(o.vy)*.45;o.vx*=.97}}else{const hw=o.w/2,hh=o.h/2;if(o.x-hw<0){o.x=hw;o.vx=Math.abs(o.vx)*.45}if(o.x+hw>W){o.x=W-hw;o.vx=-Math.abs(o.vx)*.45}if(o.y-hh<0){o.y=hh;o.vy=Math.abs(o.vy)*.45}if(o.y+hh>H-2){o.y=H-hh-2;o.vy=-Math.abs(o.vy)*.45;o.vx*=.97}}}for(let k=0;k<3;k++)for(let i=0;i<objects.length;i++)for(let j=i+1;j<objects.length;j++)collide(objects[i],objects[j])}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#d7e0e8';ctx.fillRect(0,0,W,H);ctx.fillStyle='#aab7c4';ctx.fillRect(0,H-2,W,2);for(const o of objects){const t=types[o.type];ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.angle);if(t.shape==='circle'){ctx.beginPath();ctx.arc(0,0,o.w/2,0,Math.PI*2);ctx.fillStyle=o.type==='ball'?'#f5f7fa':'#b8c0ca';ctx.fill();ctx.strokeStyle='#59636f';ctx.lineWidth=2;ctx.stroke()}else{ctx.fillStyle=o.type==='guy'?'#596b82':o.type==='platform'?'#4e5966':o.type==='heavy'?'#717b86':o.type==='crate'?'#b07b43':'#8793a0';ctx.fillRect(-o.w/2,-o.h/2,o.w,o.h);ctx.strokeStyle='#414b57';ctx.lineWidth=2;ctx.strokeRect(-o.w/2,-o.h/2,o.w,o.h);if(o.type==='guy'){ctx.fillStyle='#e4b08a';ctx.beginPath();ctx.arc(0,-o.h/2+8,7,0,Math.PI*2);ctx.fill()}}ctx.restore()}if(paused){ctx.fillStyle='rgba(0,0,0,.28)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.font='700 26px system-ui';ctx.textAlign='center';ctx.fillText('PAUSED',W/2,H/2)}}
function loop(now){const dt=Math.min((now-last)/1000,.033);last=now;step(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
document.getElementById('pause').onclick=()=>{paused=!paused;document.getElementById('pause').textContent=paused?'Resume':'Pause'};document.getElementById('clear').onclick=()=>{objects=[];drag=null;updateCount()};document.getElementById('reset').onclick=()=>{objects=[];add('platform',W/2,H-60);add('platform',W/2-170,H-160);add('platform',W/2+170,H-250);updateCount()};
add('platform',W/2,H-60);add('platform',W/2-170,H-160);add('platform',W/2+170,H-250);updateCount();
</script>
</body>
</html>
