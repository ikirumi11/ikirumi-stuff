<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Guy Sandbox</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#11151b;color:#fff;font-family:system-ui,sans-serif;touch-action:none}#app{width:100%;height:100%;position:relative}.top{height:56px;display:flex;align-items:center;gap:7px;padding:7px 9px;background:#181c23;border-bottom:1px solid #303640;position:relative;z-index:10}.title{font-weight:900;font-size:18px;margin-right:auto}.btn{border:1px solid #3b4350;background:#242a33;color:#fff;border-radius:9px;padding:8px 10px;font-weight:800}.btn:active,.item:active,.map:active{transform:scale(.96)}canvas{position:absolute;top:56px;left:0;width:100%;height:calc(100% - 56px);display:block}.hud{position:absolute;top:64px;left:9px;right:9px;pointer-events:none;z-index:4}.badge{display:inline-block;background:rgba(20,24,31,.82);border:1px solid #343b46;border-radius:8px;padding:6px 9px;font-size:11px;margin-right:5px}.right{float:right}.panel{position:absolute;left:8px;right:8px;bottom:8px;display:flex;gap:7px;overflow-x:auto;padding:8px;background:rgba(18,22,28,.96);border:1px solid #353c48;border-radius:14px;z-index:9}.item{min-width:64px;height:58px;border:1px solid #3d4551;border-radius:10px;background:#252b34;color:#fff;font-size:11px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}.item span{font-size:22px}.item.sel{border-color:#fff;background:#303844}.modal{position:absolute;inset:56px 0 0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:20}.box{width:min(650px,calc(100% - 24px));background:#181c23;border:1px solid #3b4350;border-radius:16px;padding:15px}.box h2{margin:0 0 12px}.maps{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.map{padding:15px;background:#252b34;border:1px solid #3c4552;border-radius:10px;color:#fff;text-align:left;font-weight:900}.map small{display:block;opacity:.65;font-weight:500;margin-top:3px}.tip{position:absolute;left:50%;transform:translateX(-50%);bottom:82px;background:rgba(18,22,28,.82);padding:6px 10px;border-radius:8px;font-size:11px;z-index:5;white-space:nowrap;pointer-events:none}@media(min-width:800px){.panel{left:50%;right:auto;transform:translateX(-50%);width:min(950px,calc(100% - 16px));justify-content:center}.maps{grid-template-columns:repeat(5,1fr)}}
</style>
</head>
<body>
<div id="app">
<div class="top"><div class="title">Guy Sandbox</div><button class="btn" id="mapsBtn">Maps</button><button class="btn" id="pause">Pause</button><button class="btn" id="freeze">Freeze</button><button class="btn" id="reset">Reset</button><button class="btn" id="clear">Clear</button></div>
<canvas id="game"></canvas>
<div class="hud"><span class="badge" id="status">Running</span><span class="badge" id="selected">Ragdoll</span><span class="badge right" id="count">0 objects</span></div>
<div class="tip">Q = spawn ragdoll · E = spawn selected · Wheel = zoom · Middle mouse = pan</div>
<div class="panel" id="panel"></div>
<div class="modal" id="modal"><div class="box"><button class="btn" id="close" style="float:right">Close</button><h2>Choose Map</h2><div class="maps" id="maps"></div></div></div>
</div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),panel=document.getElementById('panel'),countEl=document.getElementById('count'),selectedEl=document.getElementById('selected'),statusEl=document.getElementById('status'),modal=document.getElementById('modal'),mapsEl=document.getElementById('maps');
let W=0,H=0,dpr=1,paused=false,objects=[],joints=[],selected='guy',mode='spawn',drag=null,pan=null,last=performance.now(),camera={x:0,y:0},zoom=1,linkA=null,nextId=1;
const GRAVITY=1050,SOLVER=7;
const defs={
guy:{name:'Ragdoll',icon:'🧍',kind:'ragdoll',mass:1},
box:{name:'Box',icon:'⬛',kind:'box',w:42,h:42,mass:2},
ball:{name:'Ball',icon:'⚪',kind:'circle',r:18,mass:1},
crate:{name:'Crate',icon:'📦',kind:'box',w:52,h:44,mass:3},
heavy:{name:'Heavy',icon:'🧱',kind:'box',w:64,h:32,mass:7},
metal:{name:'Metal',icon:'🔩',kind:'box',w:44,h:44,mass:10},
wall:{name:'Wall',icon:'▬',kind:'box',w:150,h:20,mass:0,static:true},
rope:{name:'Rope',icon:'🪢',tool:'rope'},
weld:{name:'Weld',icon:'🔗',tool:'weld'},
delete:{name:'Delete',icon:'🗑️',tool:'delete'}
};
const palette=['guy','box','ball','crate','heavy','metal','wall','rope','weld','delete'];
for(const id of palette){const b=document.createElement('button');b.className='item'+(id===selected?' sel':'');b.innerHTML='<span>'+defs[id].icon+'</span>'+defs[id].name;b.onclick=()=>select(id);panel.appendChild(b)}
function select(id){selected=id;mode=defs[id].tool||'spawn';linkA=null;document.querySelectorAll('.item').forEach(b=>b.classList.remove('sel'));const i=palette.indexOf(id);if(i>=0)panel.children[i].classList.add('sel');selectedEl.textContent=defs[id].name}
function resize(){const r=canvas.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();
function id(){return nextId++}
function worldFromScreen(x,y){return{x:(x-W/2)/zoom+W/2+camera.x,y:(y-(H+56)/2)/zoom+(H+56)/2+camera.y-56}}
function screenPos(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function addBody(type,x,y){const d=defs[type];const o={id:id(),type,x,y,vx:0,vy:0,angle:0,omega:0,mass:d.mass||1,inv:d.mass?1/d.mass:0,static:!!d.static,frozen:false,pointer:false};if(d.kind==='circle'){o.r=d.r}else{o.w=d.w;o.h=d.h}objects.push(o);return o}
function addRagdoll(x,y){const o={id:id(),type:'guy',x,y,vx:0,vy:0,angle:0,omega:0,mass:5,inv:1/5,frozen:false,pointer:false,parts:[]};const specs=[['head',0,-40,16,16,0.7],['body',0,-5,22,40,1.5],['arm',-29,-4,10,34,.7],['arm',29,-4,10,34,.7],['leg',-11,39,12,40,1],['leg',11,39,12,40,1]];for(const s of specs)o.parts.push({id:id(),type:s[0],x:x+s[1],y:y+s[2],vx:0,vy:0,w:s[3],h:s[4],mass:s[5],frozen:false,angle:0,omega:0});const c=(a,b,d)=>joints.push({id:id(),a,b,type:'rag',dist:d,stiff:.82});for(let i=0;i<specs.length;i++){}c(o.parts[0].id,o.parts[1].id,32);c(o.parts[1].id,o.parts[2].id,34);c(o.parts[1].id,o.parts[3].id,34);c(o.parts[1].id,o.parts[4].id,49);c(o.parts[1].id,o.parts[5].id,49);c(o.parts[4].id,o.parts[5].id,22);o.parts.forEach(p=>p.parent=o);objects.push(o);return o}
function spawn(type,x,y){return type==='guy'?addRagdoll(x,y):addBody(type,x,y)}
function allParts(o){return o.type==='guy'?o.parts:[o]}
function center(o){if(o.type==='guy'){const p=o.parts[1];return{x:p.x,y:p.y}}return{x:o.x,y:o.y}}
function remove(o){if(!o)return;objects=objects.filter(x=>x!==o);joints=joints.filter(j=>!allParts(o).some(p=>p.id===j.a||p.id===j.b)||j.type==='rope'||j.type==='weld');joints=joints.filter(j=>{const ids=new Set(allParts(o).map(p=>p.id));return !ids.has(j.a)&&!ids.has(j.b)});updateCount()}
function updateCount(){countEl.textContent=objects.length+' objects · '+joints.filter(j=>j.type==='rope'||j.type==='weld').length+' joints'}
function hitPart(p,x,y){if(p.parent&&p.parent.type==='guy')return Math.abs(x-p.x)<p.w/2+6&&Math.abs(y-p.y)<p.h/2+6;return p.r?Math.hypot(x-p.x,y-p.y)<p.r+6:Math.abs(x-p.x)<p.w/2+6&&Math.abs(y-p.y)<p.h/2+6}
function hit(x,y){for(let i=objects.length-1;i>=0;i--){const o=objects[i];for(const p of allParts(o))if(hitPart(p,x,y))return{o,p}}return null}
function connect(a,b,type){if(!a||!b||a===b)return;const ca=center(a),cb=center(b),d=Math.max(25,Math.hypot(cb.x-ca.x,cb.y-ca.y));if(!joints.some(j=>(j.a===a.id&&j.b===b.id)||(j.a===b.id&&j.b===a.id)))joints.push({id:id(),a:a.id,b:b.id,type,dist:d,stiff:type==='weld'?1:.8});updateCount()}
function findObjectByPart(pid){for(const o of objects)if(o.id===pid||allParts(o).some(p=>p.id===pid))return o;return null}
function pointerDown(e){const s=screenPos(e);const p=worldFromScreen(s.x,s.y);if(e.button===1){pan={sx:e.clientX,sy:e.clientY,cx:camera.x,cy:camera.y};return}const h=hit(p.x,p.y);if(mode==='delete'){if(h)remove(h.o);return}if(mode==='rope'||mode==='weld'){if(!linkA){linkA=h?.o||null}else{connect(linkA,h?.o,mode);linkA=null}return}if(h){drag={o:h.o,dx:p.x-center(h.o).x,dy:p.y-center(h.o).y};h.o.pointer=true;return}if(mode==='spawn'){const o=spawn(selected,p.x,p.y);drag={o,dx:0,dy:0};o.pointer=true}}
canvas.addEventListener('pointerdown',pointerDown);
canvas.addEventListener('pointermove',e=>{if(pan){camera.x=pan.cx-(e.clientX-pan.sx)/zoom;camera.y=pan.cy-(e.clientY-pan.sy)/zoom;return}if(!drag)return;const s=screenPos(e),p=worldFromScreen(s.x,s.y),o=drag.o,dx=p.x-center(o).x,dy=p.y-center(o).y;if(o.type==='guy'){const dxc=dx-drag.dx,dyc=dy-drag.dy;for(const q of o.parts){q.x+=dxc;q.y+=dyc;q.vx=0;q.vy=0}}else{o.x=p.x-drag.dx;o.y=p.y-drag.dy;o.vx=0;o.vy=0}});
function pointerUp(){if(pan)pan=null;if(drag){drag.o.pointer=false;drag.o.vx*=1.5;drag.o.vy*=1.5;drag=null}}
canvas.addEventListener('pointerup',pointerUp);canvas.addEventListener('pointercancel',pointerUp);
canvas.addEventListener('wheel',e=>{e.preventDefault();const s=screenPos(e),before=worldFromScreen(s.x,s.y);zoom=Math.max(.35,Math.min(3,zoom*Math.pow(1.0015,-e.deltaY)));const after=worldFromScreen(s.x,s.y);camera.x+=before.x-after.x;camera.y+=before.y-after.y},{passive:false});
function key(e){if(e.target!==document.body)return;if(e.key.toLowerCase()==='q'){const p=worldFromScreen(W/2,H/2);spawn('guy',p.x,p.y)}if(e.key.toLowerCase()==='e'){const p=worldFromScreen(W/2,H/2);spawn(selected==='guy'?'box':selected,p.x,p.y)}if(e.key===' ')togglePause();if(e.key.toLowerCase()==='f')freezeCenter();if(e.key==='Delete')clearAll();if(e.key==='1')select('guy');if(e.key==='2')select('box');if(e.key==='3')select('ball');if(e.key==='4')select('crate');if(e.key==='5')select('heavy');if(e.key==='6')select('metal')}
addEventListener('keydown',key);
function freezeCenter(){const p=worldFromScreen(W/2,H/2),h=hit(p.x,p.y);if(h){const o=h.o;o.frozen=!o.frozen;allParts(o).forEach(q=>{q.frozen=o.frozen;q.vx=q.vy=0})}}
function togglePause(){paused=!paused;document.getElementById('pause').textContent=paused?'Resume':'Pause';statusEl.textContent=paused?'Paused':'Running'}
function clearAll(){objects=[];joints=[];linkA=null;updateCount()}
function bodyOfPoint(x,y){return hit(x,y)}
function getParticle(idv){for(const o of objects){for(const p of allParts(o))if(p.id===idv)return p}return null}
function solveDistance(j){const a=getParticle(j.a),b=getParticle(j.b);if(!a||!b)return;const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||.001,nx=dx/d,ny=dy/d,err=d-j.dist,wa=a.frozen?0:1/a.mass,wb=b.frozen?0:1/b.mass,sum=wa+wb;if(!sum)return;const push=err*j.stiff/sum;if(wa){a.x+=nx*push*wa;a.y+=ny*push*wa}if(wb){b.x-=nx*push*wb;b.y-=ny*push*wb}}
function solveObjectJoint(j){const a=findObjectByPart(j.a),b=findObjectByPart(j.b);if(!a||!b)return;const ca=center(a),cb=center(b),dx=cb.x-ca.x,dy=cb.y-ca.y,d=Math.hypot(dx,dy)||.001,nx=dx/d,ny=dy/d;if(j.type==='weld'){const err=d-j.dist,wa=a.frozen||a.static?0:a.inv,wb=b.frozen||b.static?0:b.inv,sum=wa+wb;if(sum){if(wa){a.x+=nx*err*wa/sum;a.y+=ny*err*wa/sum}if(wb){b.x-=nx*err*wb/sum;b.y-=ny*err*wb/sum}}}else{const err=d-j.dist,wa=a.frozen||a.static?0:a.inv,wb=b.frozen||b.static?0:b.inv,sum=wa+wb;if(sum){if(wa){a.x+=nx*err*.5*wa/sum;a.y+=ny*err*.5*wa/sum}if(wb){b.x-=nx*err*.5*wb/sum;b.y-=ny*err*.5*wb/sum}}}}
function collide(a,b){const aa=allParts(a),bb=allParts(b);if(a===b)return;for(const x of aa)for(const y of bb){if(x===y)continue;const circleA=!!x.r,circleB=!!y.r;let nx=0,ny=0,pen=0;if(circleA&&circleB){let dx=y.x-x.x,dy=y.y-x.y,d=Math.hypot(dx,dy)||.001,r=x.r+y.r;if(d<r){nx=dx/d;ny=dy/d;pen=r-d}else continue}else{const aw=x.r||x.w/2,ah=x.r||x.h/2,bw=y.r||y.w/2,bh=y.r||y.h/2,dx=y.x-x.x,dy=y.y-x.y,ox=aw+bw-Math.abs(dx),oy=ah+bh-Math.abs(dy);if(ox<=0||oy<=0)continue;if(ox<oy){nx=Math.sign(dx)||1;ny=0;pen=ox}else{nx=0;ny=Math.sign(dy)||1;pen=oy}}const ax=x.frozen||a.static,by=y.frozen||b.static;if(ax&&by)continue;const invX=ax?0:1/x.mass,invY=by?0:1/y.mass,sum=invX+invY;if(sum){const corr=pen*.72/sum;if(!ax){x.x-=nx*corr*invX;x.y-=ny*corr*invX}if(!by){y.x+=nx*corr*invY;y.y+=ny*corr*invY}}const rv=(y.vx-x.vx)*nx+(y.vy-x.vy)*ny;if(rv<0){const e=.28,imp=-(1+e)*rv/sum;if(!ax){x.vx-=imp*invX*nx;x.vy-=imp*invX*ny}if(!by){y.vx+=imp*invY*nx;y.vy+=imp*invY*ny}}}}
function boundaries(o){for(const p of allParts(o)){const hw=p.r||p.w/2,hh=p.r||p.h/2;if(p.x-hw<0){p.x=hw;p.vx=Math.abs(p.vx)*.35}if(p.x+hw>W){p.x=W-hw;p.vx=-Math.abs(p.vx)*.35}if(p.y-hh<0){p.y=hh;p.vy=Math.abs(p.vy)*.35}if(p.y+hh>H-2){p.y=H-hh-2;p.vy=-Math.abs(p.vy)*.18;p.vx*=.96}}}
function physics(dt){if(paused)return;for(const o of objects){if(o.static||o.frozen||o.pointer)continue;for(const p of allParts(o)){if(p.frozen)continue;p.vy+=GRAVITY*dt;p.vx*=.999;p.vy*=.999;p.x+=p.vx*dt;p.y+=p.vy*dt}if(o.type==='guy'){o.x=o.parts[1].x;o.y=o.parts[1].y}else{const c=allParts(o)[0];o.x=c.x;o.y=c.y}}for(let k=0;k<SOLVER;k++){for(let i=0;i<objects.length;i++)boundaries(objects[i]);for(let i=0;i<objects.length;i++)for(let j=i+1;j<objects.length;j++)collide(objects[i],objects[j]);for(const j of joints){if(j.type==='rag')solveDistance(j);else solveObjectJoint(j)}}}
function drawGrid(){ctx.strokeStyle='rgba(60,70,82,.16)';ctx.lineWidth=1;const step=50;const left=Math.floor(camera.x/step)*step,right=camera.x+W/zoom+step,top=Math.floor(camera.y/step)*step,bottom=camera.y+H/zoom+step;for(let x=left;x<right;x+=step){ctx.beginPath();ctx.moveTo(x,top);ctx.lineTo(x,bottom);ctx.stroke()}for(let y=top;y<bottom;y+=step){ctx.beginPath();ctx.moveTo(left,y);ctx.lineTo(right,y);ctx.stroke()}}
function draw(){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);ctx.save();ctx.translate(W/2,H/2);ctx.scale(zoom,zoom);ctx.translate(-W/2-camera.x,-H/2-camera.y);ctx.fillStyle='#c9d3dc';ctx.fillRect(camera.x,camera.y,W,H);drawGrid();ctx.fillStyle='#87939e';ctx.fillRect(camera.x,camera.y+H-4,W,4);for(const j of joints){if(j.type!=='rope'&&j.type!=='weld')continue;const a=findObjectByPart(j.a),b=findObjectByPart(j.b);if(a&&b){const ca=center(a),cb=center(b);ctx.strokeStyle=j.type==='weld'?'#ffb43b':'#4d657c';ctx.lineWidth=j.type==='weld'?5:2;ctx.beginPath();ctx.moveTo(ca.x,ca.y);ctx.lineTo(cb.x,cb.y);ctx.stroke()}}for(const o of objects){ctx.save();if(o.type==='guy'){for(const p of o.parts){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.angle);ctx.fillStyle=p.type==='head'?'#e3ac82':'#53677f';ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.strokeStyle='#2d3641';ctx.lineWidth=2;ctx.strokeRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore()}ctx.strokeStyle='#303844';ctx.lineWidth=4;for(const j of joints.filter(j=>j.type==='rag')){const a=getParticle(j.a),b=getParticle(j.b);if(a&&b){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}}}else{ctx.translate(o.x,o.y);ctx.rotate(o.angle);if(defs[o.type].kind==='circle'){ctx.beginPath();ctx.arc(0,0,o.r,0,Math.PI*2);ctx.fillStyle='#f4f6f8';ctx.fill();ctx.strokeStyle='#505b68';ctx.stroke()}else{ctx.fillStyle=o.type==='wall'?'#4e5966':o.type==='metal'?'#697581':o.type==='heavy'?'#727b84':o.type==='crate'?'#ad7740':'#87939e';ctx.fillRect(-o.w/2,-o.h/2,o.w,o.h);ctx.strokeStyle='#404a56';ctx.strokeRect(-o.w/2,-o.h/2,o.w,o.h)}}if(o.frozen){ctx.strokeStyle='#58a9ff';ctx.lineWidth=3;const p=allParts(o)[0];ctx.strokeRect((o.type==='guy'?o.x:o.x)-25,(o.type==='guy'?o.y:o.y)-25,50,50)}ctx.restore()}if(linkA){const c=center(linkA);ctx.strokeStyle='#ffcf5a';ctx.lineWidth=3;ctx.beginPath();ctx.arc(c.x,c.y,15,0,Math.PI*2);ctx.stroke()}ctx.restore();if(paused){ctx.fillStyle='rgba(0,0,0,.28)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.font='800 26px system-ui';ctx.textAlign='center';ctx.fillText('PAUSED',W/2,H/2)}}
const maps=[['Garage','Small balanced starter map'],['Warehouse','Walls and stacked platforms'],['Tower','Tall climbing structure'],['Pit','Open central pit'],['Playground','Scattered platforms']];
function loadMap(name){clearAll();const cx=W/2,base=H-70;if(name==='Garage'){addBody('wall',cx,base);addBody('wall',cx-190,base-115);addBody('wall',cx+190,base-220);spawn('guy',cx-70,100);spawn('box',cx+30,100);spawn('ball',cx+90,80)}if(name==='Warehouse'){addBody('wall',cx,base);addBody('wall',70,H/2);addBody('wall',W-70,H/2);addBody('wall',cx,H/2+90);addBody('wall',cx-180,H/2-70);spawn('guy',cx-80,100);spawn('crate',cx+80,100);spawn('heavy',cx+150,50)}if(name==='Tower'){addBody('wall',cx,base);for(let i=0;i<5;i++)addBody('wall',cx+(i%2?120:-120),base-100-i*100);spawn('guy',cx,100);spawn('box',cx+40,60)}if(name==='Pit'){addBody('wall',cx-230,base);addBody('wall',cx+230,base);addBody('wall',cx-160,base-190);addBody('wall',cx+160,base-190);addBody('wall',cx,base-360);spawn('guy',cx,80);spawn('ball',cx-70,100);spawn('crate',cx+70,100)}if(name==='Playground'){addBody('wall',cx,base);for(let i=0;i<6;i++)addBody('wall',80+i*(W-160)/5,base-100-(i%2)*90);spawn('guy',cx-90,100);spawn('guy',cx+90,100);spawn('ball',cx,70)}updateCount();modal.style.display='none'}
for(const m of maps){const b=document.createElement('button');b.className='map';b.innerHTML=m[0]+'<small>'+m[1]+'</small>';b.onclick=()=>loadMap(m[0]);mapsEl.appendChild(b)}
document.getElementById('mapsBtn').onclick=()=>modal.style.display='flex';document.getElementById('close').onclick=()=>modal.style.display='none';document.getElementById('pause').onclick=togglePause;document.getElementById('freeze').onclick=freezeCenter;document.getElementById('clear').onclick=clearAll;document.getElementById('reset').onclick=()=>loadMap('Garage');
loadMap('Garage');
function loop(t){const dt=Math.min((t-last)/1000,.02);last=t;physics(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script>
</body>
</html>
