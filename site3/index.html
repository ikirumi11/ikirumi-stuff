<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ikirumi Stuff Launcher</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif}body{background:#0b0d12;color:#fff;padding:24px}.wrap{max-width:900px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.logo{font-size:24px;font-weight:800}.muted{color:#8f98a7}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}.card{border:1px solid #292e38;background:#12161d;border-radius:16px;padding:18px;cursor:pointer;transition:.15s}.card:hover{border-color:#667080;transform:translateY(-1px)}.card h2{margin:0 0 7px;font-size:19px}.card p{margin:0;color:#9da6b5;font-size:13px;line-height:1.5}.card button{margin-top:16px;width:100%;border:1px solid #39414d;background:#1b212a;color:#fff;border-radius:10px;padding:11px;font-weight:700;cursor:pointer}.card button:hover{background:#242b36}.status{margin:0 0 18px;padding:13px 15px;border:1px solid #292e38;background:#10141b;border-radius:12px;color:#aeb7c5;font-size:13px;display:none}.status.show{display:block}.error{color:#ff9b9b}.empty{text-align:center;padding:40px;color:#8f98a7;border:1px dashed #303641;border-radius:16px}.spin{display:inline-block;width:13px;height:13px;border:2px solid #424a57;border-top-color:#fff;border-radius:50%;animation:r .7s linear infinite;vertical-align:-2px;margin-right:7px}@keyframes r{to{transform:rotate(360deg)}}@media(max-width:600px){body{padding:15px}.top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div><div class="logo">Ikirumi Stuff</div><div class="muted">Choose a site to download and open locally</div></div><button id="refresh" style="border:1px solid #39414d;background:#171c24;color:#fff;border-radius:10px;padding:10px 14px;cursor:pointer">↻ Refresh</button></div>
<div id="status" class="status"></div>
<div id="sites" class="grid"><div class="empty"><span class="spin"></span>Finding sites on GitHub…</div></div>
</div>
<script>
(()=>{
'use strict';
const OWNER='ikirumi11',REPO='ikirumi-stuff',BRANCH='main';
const API=`https://api.github.com/repos/${OWNER}/${REPO}/git/trees/${encodeURIComponent(BRANCH)}?recursive=1`;
const RAW=`https://raw.githubusercontent.com/${OWNER}/${REPO}/${encodeURIComponent(BRANCH)}/`;
const sitesEl=document.getElementById('sites'),statusEl=document.getElementById('status');
let treePaths=[];
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function setStatus(text,show=true,error=false){statusEl.className='status'+(show?' show':'');statusEl.innerHTML=error?`<span class="error">${esc(text)}</span>`:esc(text)}
function pathResolve(from,to){
 if(!to||/^(https?:|data:|blob:|\/\/|#|javascript:|mailto:)/i.test(to))return to;
 const base=from.includes('/')?from.slice(0,from.lastIndexOf('/')+1):'';
 const parts=(base+to).split('/'),out=[];
 for(const p of parts){if(!p||p==='.'){continue}if(p==='..')out.pop();else out.push(p)}
 return out.join('/');
}
function siteList(paths){const set=new Set();for(const p of paths){const m=p.match(/^([^/]+)\//);if(m&&m[1].toLowerCase()!=='site3')set.add(m[1])}return [...set].sort((a,b)=>a.localeCompare(b))}
function describe(name,paths){const count=paths.filter(p=>p.startsWith(name+'/')).length;return `${count} file${count===1?'':'s'} in ${name}`}
function renderSites(sites){if(!sites.length){sitesEl.innerHTML='<div class="empty">No other site folders were found.</div>';return}sitesEl.innerHTML=sites.map(name=>`<div class="card" data-site="${esc(name)}"><h2>${esc(name)}</h2><p>${esc(describe(name,treePaths))}</p><button>Download & open</button></div>`).join('');for(const card of sitesEl.querySelectorAll('.card'))card.onclick=()=>launch(card.dataset.site)}
async function getTree(){setStatus('Checking GitHub for the newest site list…');const r=await fetch(API+'?v='+Date.now(),{cache:'no-store',headers:{Accept:'application/vnd.github+json'}});if(!r.ok)throw Error('GitHub API returned HTTP '+r.status);const j=await r.json();if(j.truncated)throw Error('GitHub returned a truncated file tree.');treePaths=(j.tree||[]).filter(x=>x.type==='blob').map(x=>x.path);renderSites(siteList(treePaths));setStatus('Choose a site. Nothing is downloaded until you select one.')}
async function fetchFile(path){const r=await fetch(RAW+path.split('/').map(encodeURIComponent).join('/')+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(`${path}: HTTP ${r.status}`);return await r.blob()}
function replaceCssUrls(text,from,urls){return text.replace(/url\(([^)]+)\)/gi,(all,raw)=>{let q=raw.trim(),quote='';if((q.startsWith('"')&&q.endsWith('"'))||(q.startsWith("'")&&q.endsWith("'"))){quote=q[0];q=q.slice(1,-1)}if(!q||/^(data:|blob:|https?:|\/\/|#)/i.test(q))return all;const target=pathResolve(from,q);return urls.has(target)?`url(${quote}${urls.get(target)}${quote})`:all})}
async function buildSite(site,paths,files){
 const entry=paths.includes(site+'/index.html')?site+'/index.html':paths.find(p=>/^.+\/[^/]+\.html?$/i.test(p));if(!entry)throw Error('The selected site has no HTML entry file.');
 const blobUrls=new Map();for(const [p,b] of files)if(!/\.html?$/i.test(p))blobUrls.set(p,URL.createObjectURL(b));
 const entryRel=entry.slice(site.length+1);const htmlBlob=files.get(entry);const text=await htmlBlob.text();const doc=new DOMParser().parseFromString(text,'text/html');
 for(const el of doc.querySelectorAll('[src],[href],[poster]')){const attr=el.hasAttribute('src')?'src':el.hasAttribute('poster')?'poster':'href';const val=el.getAttribute(attr);if(!val||/^(https?:|data:|blob:|\/\/|#|javascript:|mailto:)/i.test(val))continue;const target=pathResolve(entryRel,val);if(blobUrls.has(site+'/'+target))el.setAttribute(attr,blobUrls.get(site+'/'+target));}
 for(const link of [...doc.querySelectorAll('link[rel="stylesheet"]')]){const href=link.getAttribute('href');if(!href||/^(https?:|data:|blob:|\/\/)/i.test(href))continue;const target=pathResolve(entryRel,href),blob=files.get(site+'/'+target);if(blob){const css=replaceCssUrls(await blob.text(),target,blobUrls);const style=doc.createElement('style');style.textContent=css;link.replaceWith(style)}}
 for(const script of [...doc.querySelectorAll('script[src]')]){const src=script.getAttribute('src');if(!src||/^(https?:|data:|blob:|\/\/)/i.test(src))continue;const target=pathResolve(entryRel,src),blob=files.get(site+'/'+target);if(blob){const code=await blob.text();if((script.getAttribute('type')||'').toLowerCase()==='module'){const u=URL.createObjectURL(new Blob([code],{type:'text/javascript'}));script.setAttribute('src',u)}else{script.removeAttribute('src');script.textContent=code}}}
 for(const el of doc.querySelectorAll('[style]'))el.setAttribute('style',replaceCssUrls(el.getAttribute('style'),entryRel,blobUrls));
 for(const el of doc.querySelectorAll('style'))el.textContent=replaceCssUrls(el.textContent,entryRel,blobUrls);
 return '<!doctype html>'+doc.documentElement.outerHTML;
}
async function launch(site){
 const win=window.open('about:blank','_blank');if(!win){setStatus('Your browser blocked the new tab. Allow pop-ups for this site and try again.',true,true);return}
 win.document.write('<body style="margin:0;background:#0b0d12;color:white;font:16px system-ui;display:grid;place-items:center;height:100vh"><div>Downloading '+esc(site)+'…</div></body>');win.document.close();
 try{const paths=treePaths.filter(p=>p.startsWith(site+'/'));if(!paths.length)throw Error('No files found for '+site);const files=new Map();for(let i=0;i<paths.length;i++){setStatus(`Downloading ${i+1} of ${paths.length}: ${paths[i]}`);files.set(paths[i],await fetchFile(paths[i]))}setStatus('Building the local site…');const finalHtml=await buildSite(site,paths,files);const url=URL.createObjectURL(new Blob([finalHtml],{type:'text/html'}));win.location.href=url;setStatus(`${site} downloaded and opened in a new tab.`)}catch(e){try{win.document.body.innerHTML='<div style="font-family:system-ui;padding:30px;color:#ff9b9b">Could not load site: '+esc(e.message)+'</div>'}catch{}setStatus(e.message,true,true)}}
document.getElementById('refresh').onclick=()=>getTree().catch(e=>setStatus(e.message,true,true));
getTree().catch(e=>{sitesEl.innerHTML='<div class="empty error">Could not read the GitHub repository.</div>';setStatus(e.message,true,true)});
})();
</script>
</body>
</html>
