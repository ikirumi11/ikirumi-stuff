<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ikirumi Books</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#07080b;color:#fff;font-family:Inter,Arial,sans-serif}
body{overflow:hidden}
#app{width:100%;height:100%;display:flex;flex-direction:column}
.topbar{height:68px;min-height:68px;display:flex;align-items:center;gap:18px;padding:0 22px;background:rgba(13,15,20,.88);border-bottom:1px solid rgba(255,255,255,.08);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);position:relative;z-index:20}
.logo{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800;letter-spacing:.3px;white-space:nowrap}
.logo-dot{width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 0 18px rgba(255,255,255,.7)}
.nav{display:flex;align-items:center;gap:6px;margin-left:auto}
.nav button{border:0;color:#fff;background:rgba(255,255,255,.1);padding:10px 15px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer}
.content{position:relative;flex:1;min-height:0;background:#050608}
#books{width:100%;height:100%;border:0;display:block;background:#050608}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#07080b;z-index:100;transition:opacity .35s}
.loader{width:42px;height:42px;border-radius:50%;border:3px solid rgba(255,255,255,.1);border-top-color:#fff;animation:spin .8s linear infinite}
.loading-text{margin-top:18px;color:#777f8c;font-size:13px}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:650px){.topbar{padding:0 12px}.logo{font-size:17px}.nav button{padding:9px 10px}}
</style>
</head>
<body>
<div id="app">
<header class="topbar">
<div class="logo"><span class="logo-dot"></span>Ikirumi</div>
<nav class="nav"><button class="active" type="button">Books</button></nav>
</header>
<main class="content">
<iframe id="books" title="Ikirumi Books" src="about:blank"></iframe>
</main>
</div>
<div id="loading">
<div class="loader"></div>
<div class="loading-text">Loading Books...</div>
</div>
<script>
const BOOKS_URL="https://raw.githubusercontent.com/ikirumi11/ikirumi-stuff/main/books.html";
async function loadBooks(){
 try{
  const response=await fetch(BOOKS_URL+"?refresh="+Date.now(),{cache:"no-store"});
  if(!response.ok)throw new Error("GitHub returned "+response.status);
  let html=await response.text();
  const base='<base href="https://raw.githubusercontent.com/ikirumi11/ikirumi-stuff/main/">';
  if(/<head\b[^>]*>/i.test(html))html=html.replace(/<head\b([^>]*)>/i,'<head$1>'+base);
  else html='<!DOCTYPE html><html><head>'+base+'</head><body>'+html+'</body></html>';
  const frame=document.getElementById("books");
  frame.srcdoc=html;
  frame.onload=()=>{
   const loading=document.getElementById("loading");
   loading.style.opacity="0";
   setTimeout(()=>loading.remove(),400);
  };
 }catch(error){
  console.error(error);
  const loading=document.getElementById("loading");
  loading.querySelector(".loading-text").textContent="Could not load Books";
  setTimeout(()=>{loading.style.opacity="0";setTimeout(()=>loading.remove(),400)},700);
 }
}
loadBooks();
</script>
</body>
</html>
