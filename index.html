<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Books</title>
<style>
:root{--bg:#f3f0e8;--text:#25221d;--muted:#777064;--panel:#fff;--line:#d8d1c3;--button:#fffaf1}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Georgia,'Times New Roman',serif;background:var(--bg);color:var(--text);transition:background .2s,color .2s}
body{padding:32px}
body.dark{--bg:#101114;--text:#f1eee7;--muted:#aaa59a;--panel:#191a1e;--line:#34353b;--button:#202126}
header{max-width:1200px;margin:0 auto 32px;text-align:center;position:relative}
h1{font-size:42px;font-weight:400;margin:0 0 8px;letter-spacing:.5px}
p{margin:0;color:var(--muted);font-family:Arial,sans-serif}
.theme{position:absolute;right:0;top:0;margin:0;padding:10px 14px;border:1px solid var(--line);background:var(--button);color:var(--text);border-radius:9px;font-family:Arial,sans-serif;cursor:pointer}
.gallery{max-width:1200px;margin:auto;min-height:55vh;display:flex;align-items:center;justify-content:center}
.empty{text-align:center;color:var(--muted);font-family:Arial,sans-serif}
.emptyIcon{font-size:54px;opacity:.45;margin-bottom:12px}
.empty h2{font-family:Georgia,'Times New Roman',serif;font-size:24px;font-weight:400;color:var(--text);margin:0 0 7px}
.empty p{font-size:14px}
@media(max-width:600px){body{padding:20px}h1{font-size:32px;padding-top:42px}.theme{top:0;right:50%;transform:translateX(50%)}.gallery{min-height:65vh}}
</style>
</head>
<body>
<header>
<button class="theme" id="theme" aria-label="Toggle dark mode">🌙 Dark mode</button>
<h1>Books</h1>
<p>Your book gallery.</p>
</header>
<main class="gallery">
<section class="empty">
<div class="emptyIcon">📖</div>
<h2>No books yet</h2>
<p>Your book gallery is empty.</p>
</section>
</main>
<script>
const body=document.body;
const theme=document.getElementById('theme');
const saved=localStorage.getItem('blankBookDarkMode');
if(saved==='true')body.classList.add('dark');
function updateThemeButton(){theme.textContent=body.classList.contains('dark')?'☀️ Light mode':'🌙 Dark mode'}
theme.onclick=()=>{body.classList.toggle('dark');localStorage.setItem('blankBookDarkMode',body.classList.contains('dark'));updateThemeButton()};
updateThemeButton();
</script>
</body>
</html>
