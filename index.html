<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ikirumi Stuff</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#080a0f;color:#fff}body{padding:clamp(14px,3vw,36px)}.wrap{width:min(1200px,100%);margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:26px}.title h1{margin:0;font-size:clamp(25px,4vw,42px);letter-spacing:-1px}.title p{margin:6px 0 0;color:#8993a3;font-size:14px}.refresh{border:1px solid #303744;background:#151a22;color:#fff;border-radius:11px;padding:11px 15px;font-weight:700;cursor:pointer}.refresh:hover{background:#202632}.status{display:none;margin-bottom:16px;padding:12px 14px;border:1px solid #2a303a;background:#10141b;border-radius:11px;color:#aeb7c5;font-size:13px}.status.show{display:block}.error{color:#ff9b9b;border-color:#633737}.warning{color:#ffd38a;border-color:#66502d}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{display:flex;flex-direction:column;min-height:210px;padding:20px;border:1px solid #292f39;background:#11151c;border-radius:18px;box-shadow:0 8px 30px #0003}.card.incomplete{border-color:#633737}.badge{display:inline-flex;width:max-content;padding:5px 9px;border:1px solid #303743;border-radius:999px;color:#9ea8b7;font-size:11px;margin-bottom:15px}.card.incomplete .badge{border-color:#633737;color:#ff9b9b}.card h2{margin:0 0 8px;font-size:21px}.card p{margin:0;color:#8f99a8;font-size:14px;line-height:1.55}.open{margin-top:auto;padding-top:20px}.open button{width:100%;border:1px solid #39414d;background:#1a2029;color:#fff;border-radius:11px;padding:12px;font-weight:700;cursor:pointer}.open button:hover{background:#252d38}.open button:disabled{opacity:.45;cursor:not-allowed}.empty{text-align:center;padding:35px;border:1px dashed #303641;border-radius:16px;color:#8f98a7;grid-column:1/-1}.foot{margin-top:22px;color:#667080;font-size:12px;text-align:center}@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){body{padding:12px}.top{align-items:flex-start}.refresh{padding:10px 12px}.grid{grid-template-columns:1fr;gap:12px}.card{min-height:175px;padding:17px}.title p{font-size:13px}.card h2{font-size:19px}}</style></head><body><div class="wrap"><div class="top"><div class="title"><h1>Ikirumi Stuff</h1><p>Site 1 · Chat App 2</p></div><button class="refresh" id="refresh">↻ Refresh</button></div><div class="status" id="status"></div><div class="grid" id="sites"><div class="empty">Loading sites…</div></div><div class="foot">Only the active site is kept in the root site collection.</div></div><script>(()=>{'use strict';const API='https://api.github.com/repos/ikirumi11/ikirumi-stuff/git/trees/main?recursive=1';const RAW='https://raw.githubusercontent.com/ikirumi11/ikirumi-stuff/main/';const sitesEl=document.getElementById('sites'),statusEl=document.getElementById('status');function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function status(t,type=''){statusEl.className='status show'+(type?' '+type:'');statusEl.textContent=t}async function load(){status('Reading the root folders from GitHub…');const r=await fetch(API+'?v='+Date.now(),{cache:'no-store',headers:{Accept:'application/vnd.github+json'}});if(!r.ok)throw Error('GitHub returned HTTP '+r.status);const j=await r.json();const files=(j.tree||[]).filter(x=>x.type==='blob').map(x=>x.path);const roots=[...new Set(files.map(p=>p.split('/')[0]).filter(x=>/^site\d+$/i.test(x)))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));if(!roots.length){sitesEl.innerHTML='<div class="empty">No site folders found.</div>';status('No site folders found.','error');return}const info=roots.map((name,i)=>{const siteFiles=files.filter(p=>p.startsWith(name+'/'));const hasIndex=siteFiles.includes(name+'/index.html');return{name,i,count:siteFiles.length,hasIndex,title:name.toLowerCase()==='site1'?'Chat App 2':name}});const incomplete=info.filter(x=>!x.hasIndex);sitesEl.innerHTML=info.map(x=>`<article class="card${x.hasIndex?'':' incomplete'}"><span class="badge">SITE ${x.i+1}</span><h2>${esc(x.title)}</h2><p>${x.count} file${x.count===1?'':'s'}${x.hasIndex?' · ready to open':' · INCOMPLETE · missing index.html'}</p><div class="open"><button data-site="${esc(x.name)}" ${x.hasIndex?'':'disabled'}>${x.hasIndex?'Open site':'Incomplete'}</button></div></article>`).join('');for(const b of sitesEl.querySelectorAll('[data-site]:not(:disabled)'))b.onclick=()=>openSite(b.dataset.site);if(incomplete.length){status(`${roots.length} site${roots.length===1?'':'s'} found, but ${incomplete.length} site${incomplete.length===1?' is':'s are'} incomplete. Nothing is marked complete until its required index.html exists.`,'warning')}else status(`${roots.length} site${roots.length===1?'':'s'} found. All detected sites are complete.`)}function openSite(site){location.href=RAW+encodeURIComponent(site)+'/index.html'}document.getElementById('refresh').onclick=()=>load().catch(e=>{sitesEl.innerHTML='<div class="empty">Could not load the sites.</div>';status('ERROR: '+e.message,'error')});load().catch(e=>{sitesEl.innerHTML='<div class="empty">Could not load the sites.</div>';status('ERROR: '+e.message,'error')})})();</script></body></html>
