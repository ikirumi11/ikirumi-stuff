<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ikirumi Model Blocks</title><link rel="stylesheet" href="css/app.css"></head><body><div id="app"><header class="topbar"><div class="brand">IKIRUMI <span>MODEL BLOCKS</span></div><div class="top-actions"><button id="newProject">New</button><button id="saveProject">Save</button><button id="loadProject">Load</button><button id="exportObj">Export OBJ</button><button id="runProject" class="primary">▶ Run</button></div></header><main class="workspace"><aside class="sidebar"><div class="panel-title">BLOCK LIBRARY</div><input id="blockSearch" placeholder="Search blocks…"><div id="palette" class="palette"></div></aside><section class="center"><div class="viewport-toolbar"><span id="objectCount">0 objects</span><span id="faceCount">0 faces</span><button id="resetView">Reset view</button><button id="gridToggle">Grid</button></div><canvas id="viewport"></canvas><div id="status">Ready</div></section><aside class="inspector"><div class="panel-title">INSPECTOR</div><div id="inspectorContent"><p>Default scene</p><div class="hint">A Cube block is loaded automatically. Click blocks in the library to add them to the graph, change values, then press <b>Run</b>.</div></div></aside></main><section class="graph-wrap"><div class="graph-head"><b>MODEL GRAPH</b><span>Click blocks to add • drag nodes to arrange</span><button id="clearGraph">Clear Graph</button></div><div id="graph" class="graph"></div></section></div><input id="fileInput" type="file" accept="application/json" hidden><script type="module" src="js/main.js"></script></body></html>
