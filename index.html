<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Blank Book Gallery</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Georgia,'Times New Roman',serif;background:#f3f0e8;color:#25221d}
body{padding:32px}
header{max-width:1200px;margin:0 auto 32px;text-align:center}
h1{font-size:42px;font-weight:400;margin:0 0 8px;letter-spacing:.5px}
p{margin:0;color:#777064;font-family:Arial,sans-serif}
.gallery{max-width:1200px;margin:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:28px}
.book{aspect-ratio:3/4;background:#fff;border:1px solid #d8d1c3;border-radius:4px 10px 10px 4px;box-shadow:8px 8px 0 #ddd6c9,0 8px 22px #0001;position:relative;overflow:hidden;cursor:pointer;transition:transform .18s,box-shadow .18s}
.book:hover{transform:translateY(-6px) rotate(-1deg);box-shadow:11px 14px 0 #d7d0c3,0 14px 28px #0002}
.book:before{content:'';position:absolute;left:18px;top:0;bottom:0;width:2px;background:#eee8dc;box-shadow:5px 0 #faf7f0}
.cover{position:absolute;inset:0;padding:28px 25px 25px 32px;display:flex;flex-direction:column;justify-content:space-between}
.blank{flex:1;border:1px dashed #e5dfd4;margin:8px 0 18px;background:linear-gradient(transparent 31px,#eee9df 32px);background-size:100% 32px}
.label{font-family:Arial,sans-serif;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#aaa296}
.title{font-size:20px;color:#8c8477}
button{display:block;margin:28px auto 0;padding:11px 20px;border:1px solid #cbc3b5;background:#fffaf1;border-radius:8px;font-family:Arial,sans-serif;color:#625c52;cursor:pointer}
button:hover{background:#fff}
@media(max-width:600px){body{padding:20px}h1{font-size:32px}.gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.book{box-shadow:5px 5px 0 #ddd6c9}}
</style>
</head>
<body>
<header>
<h1>Blank Book Gallery</h1>
<p>A simple gallery of blank books.</p>
</header>
<main class="gallery" id="gallery"></main>
<button id="add">Add Blank Book</button>
<script>
const gallery=document.getElementById('gallery');
let books=Number(localStorage.getItem('blankBookCount')||12);
function render(){
 gallery.innerHTML='';
 for(let i=1;i<=books;i++){
  const book=document.createElement('article');
  book.className='book';
  book.innerHTML='<div class="cover"><div class="label">Blank Book '+i+'</div><div class="blank"></div><div class="title">Untitled</div></div>';
  gallery.appendChild(book);
 }
}
document.getElementById('add').onclick=()=>{books++;localStorage.setItem('blankBookCount',books);render()};
render();
</script>
</body>
</html>
