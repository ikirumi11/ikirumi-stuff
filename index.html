<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ikirumi Stuff</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#080a0f;color:#fff}body{padding:clamp(14px,3vw,36px)}.wrap{width:min(1200px,100%);margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:26px}.title h1{margin:0;font-size:clamp(25px,4vw,42px)}.title p{margin:6px 0 0;color:#8993a3;font-size:14px}.refresh{border:1px solid #303744;background:#151a22;color:#fff;border-radius:11px;padding:11px 15px;font-weight:700;cursor:pointer}.status{display:none;margin-bottom:16px;padding:12px 14px;border:1px solid #2a303a;background:#10141b;border-radius:11px;color:#aeb7c5;font-size:13px}.status.show{display:block}.warning{color:#ffd38a;border-color:#66502d}.error{color:#ff9b9b;border-color:#633737}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{display:flex;flex-direction:column;min-height:210px;padding:20px;border:1px solid #292f39;background:#11151c;border-radius:18px}.card.locked{border-color:#66502d}.card.incomplete{border-color:#633737}.badge{display:inline-flex;width:max-content;padding:5px 9px;border:1px solid #303743;border-radius:999px;color:#9ea8b7;font-size:11px;margin-bottom:15px}.card.locked .badge{border-color:#66502d;color:#ffd38a}.card.incomplete .badge{border-color:#633737;color:#ff9b9b}.card h2{margin:0 0 8px;font-size:21px}.card p{margin:0;color:#8f99a8;font-size:14px;line-height:1.55}.open{margin-top:auto;padding-top:20px}.open button{width:100%;border:1px solid #39414d;background:#1a2029;color:#fff;border-radius:11px;padding:12px;font-weight:700;cursor:pointer}.open button:disabled{opacity:.45;cursor:not-allowed}.empty{text-align:center;padding:35px;border:1px dashed #303641;border-radius:16px;color:#8f98a7;grid-column:1/-1}.foot{margin-top:22px;color:#667080;font-size:12px;text-align:center}.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:20px;background:#000b;z-index:100}.modal.show{display:flex}.box{width:min(420px,100%);background:#11151c;border:1px solid #343b47;border-radius:18px;padding:22px}.box h2{margin:0 0 8px}.box p{margin:0 0 16px;color:#929cab;font-size:14px}.box input{width:100%;padding:12px;border:1px solid #39414d;background:#0b0f15;color:#fff;border-radius:10px}.actions{display:flex;gap:10px;margin-top:14px}.box button{flex:1;border:1px solid #39414d;background:#1a2029;color:#fff;border-radius:10px;padding:11px;font-weight:700;cursor:pointer}.box button.primary{background:#26313e}.lockError{display:none;color:#ff9b9b;font-size:13px;margin-top:10px}.lockError.show{display:block}@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){body{padding:12px}.grid{grid-template-columns:1fr;gap:12px}.card{min-height:175px;padding:17px}.box{padding:18px}}
</style>
</head>
<body>
<div class="wrap"><div class="top"><div class="title"><h1>Ikirumi Stuff</h1><p>Choose a site to open</p></div><button class="refresh" id="refresh">↻ Refresh</button></div><div class="status" id="status"></div><div class="grid" id="sites"><div class="empty">Loading sites…</div></div><div class="foot">Site locks are controlled by site-lock.json.</div></div>
<div class="modal" id="lockModal"><div class="box"><h2>🔒 Site locked</h2><p id="lockText">Enter the password to open this site.</p><input id="password" type="password" autocomplete="off" placeholder="Password"><div class="lockError" id="lockError">Wrong password.</div><div class="actions"><button id="cancelLock">Cancel</button><button class="primary" id="unlock">Unlock</button></div></div></div>
<script>
(()=>{
'use strict';
const API='https://api.github.com/repos/ikirumi11/ikirumi-stuff/git/trees/main?recursive=1';
const RAW='https://raw.githubusercontent.com/ikirumi11/ikirumi-stuff/main/';
const LOCK_CONFIG=RAW+'site-lock.json';
const HIDDEN_PASSWORD=['Klu','t1234'].join('');
const sitesEl=document.getElementById('sites'),statusEl=document.getElementById('status'),modal=document.getElementById('lockModal'),passwordEl=document.getElementById('password'),lockError=document.getElementById('lockError'),lockText=document.getElementById('lockText');
let lockConfig={password:HIDDEN_PASSWORD,sites:{}},pendingSite=null;
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function status(t,type=''){statusEl.className='status show '+type;statusEl.textContent=t}
function isLocked(site){return lockConfig.sites?.[site]===true}
function isUnlocked(site){return sessionStorage.getItem('ikirumi-site-unlocked:'+site)==='1'}
function openLock(site,title){pendingSite=site;passwordEl.value='';lockError.classList.remove('show');lockText.textContent='Enter the password to open '+title+'.';modal.classList.add('show');setTimeout(()=>passwordEl.focus(),50)}
function closeLock(){pendingSite=null;modal.classList.remove('show');passwordEl.value='';lockError.classList.remove('show')}
function tryUnlock(){if(!pendingSite)return;if(passwordEl.value===HIDDEN_PASSWORD){sessionStorage.setItem('ikirumi-site-unlocked:'+pendingSite,'1');const s=pendingSite;closeLock();openSite(s)}else{lockError.classList.add('show');passwordEl.select()}}
function openSite(site){if(isLocked(site)&&!isUnlocked(site)){const c=[...sitesEl.querySelectorAll('[data-site]')].find(x=>x.dataset.site===site);openLock(site,c?.dataset.title||site);return}location.href=RAW+encodeURIComponent(site)+'/index.html'}
async function loadLockConfig(){try{const r=await fetch(LOCK_CONFIG+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const j=await r.json();lockConfig={password:HIDDEN_PASSWORD,sites:j?.sites&&typeof j.sites==='object'?j.sites:{}}}catch(e){lockConfig={password:HIDDEN_PASSWORD,sites:{}};status('Lock configuration could not be read, so all sites are treated as unlocked.','warning')}}
async function load(){status('Reading the root folders from GitHub…');await loadLockConfig();const r=await fetch(API+'&v='+Date.now(),{cache:'no-store',headers:{Accept:'application/vnd.github+json'}});if(!r.ok)throw Error('GitHub returned HTTP '+r.status);const j=await r.json();const files=(j.tree||[]).filter(x=>x.type==='blob').map(x=>x.path);const roots=[...new Set(files.map(p=>p.split('/')[0]).filter(x=>/^site\d+$/i.test(x)))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));if(!roots.length){sitesEl.innerHTML='<div class="empty">No site folders found.</div>';status('No site folders found.','error');return}const info=roots.map((name,i)=>{const sf=files.filter(p=>p.startsWith(name+'/'));return{name,i,count:sf.length,hasIndex:sf.includes(name+'/index.html'),locked:isLocked(name),title:name.toLowerCase()==='site1'?'Chat App 2':name}});const incomplete=info.filter(x=>!x.hasIndex);sitesEl.innerHTML=info.map(x=>`<article class="card${x.hasIndex?'':' incomplete'}${x.locked?' locked':''}"><span class="badge">${x.locked?'🔒 LOCKED':'SITE '+(x.i+1)}</span><h2>${esc(x.title)}</h2><p>${x.count} file${x.count===1?'':'s'}${x.hasIndex?(x.locked?' · password required':' · ready to open'):' · INCOMPLETE · missing index.html'}</p><div class="open"><button data-site="${esc(x.name)}" data-title="${esc(x.title)}" ${x.hasIndex?'':'disabled'}>${x.hasIndex?(x.locked?'Unlock and open':'Open site'):'Incomplete'}</button></div></article>`).join('');for(const b of sitesEl.querySelectorAll('[data-site]:not(:disabled)'))b.onclick=()=>openSite(b.dataset.site);if(incomplete.length)status(`${roots.length} site${roots.length===1?'':'s'} found, but ${incomplete.length} incomplete.`,'warning');else{const lc=info.filter(x=>x.locked).length;status(`${roots.length} site${roots.length===1?'':'s'} found. ${lc?lc+' locked site'+(lc===1?'':'s')+'.':'All detected sites are unlocked.'}`)}}
document.getElementById('unlock').onclick=tryUnlock;document.getElementById('cancelLock').onclick=closeLock;passwordEl.addEventListener('keydown',e=>{if(e.key==='Enter')tryUnlock();if(e.key==='Escape')closeLock()});modal.addEventListener('click',e=>{if(e.target===modal)closeLock()});document.getElementById('refresh').onclick=()=>load().catch(e=>{sitesEl.innerHTML='<div class="empty">Could not load the sites.</div>';status('ERROR: '+e.message,'error')});load().catch(e=>{sitesEl.innerHTML='<div class="empty">Could not load the sites.</div>';status('ERROR: '+e.message,'error')});
})();
</script>
</body>
</html>
