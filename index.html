<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ikirumi Model Blocks</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
<header class="topbar"><div class="brand">IKIRUMI <span>MODEL BLOCKS</span></div><div class="top-actions"><button id="newProject">New</button><button id="saveProject">Save</button><button id="loadProject">Load</button><button id="exportObj">Export OBJ</button><button id="runProject" class="primary">▶ Run</button></div></header>
<main class="workspace">
<aside class="sidebar"><div class="panel-title">BLOCKS</div><input id="blockSearch" placeholder="Search 100+ blocks…"><div id="categories"></div><div id="palette"></div></aside>
<section class="center"><div class="viewport-toolbar"><span id="objectCount">0 objects</span><span id="faceCount">0 faces</span><button id="resetView">Reset view</button><button id="gridToggle">Grid</button></div><canvas id="viewport"></canvas><div id="status">Ready — drag blocks into the graph.</div></section>
<aside class="inspector"><div class="panel-title">INSPECTOR</div><div id="inspectorContent">Select an object to inspect it.</div></aside>
</main>
<section class="graph-wrap"><div class="graph-head"><b>MODEL GRAPH</b><span>Drag blocks from the left • connect outputs to inputs • run to build the mesh</span><button id="clearGraph">Clear Graph</button></div><div id="graph" class="graph"></div></section>
</div>
<input id="fileInput" type="file" accept="application/json" hidden>
<script type="module" src="js/main.js"></script>
</body>
</html>
