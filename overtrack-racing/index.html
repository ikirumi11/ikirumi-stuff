<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Overtrack Racing</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#090b0e;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:flex;flex-direction:column}#hud{height:58px;flex:0 0 58px;display:flex;align-items:center;gap:10px;padding:8px 12px;background:#10141a;border-bottom:1px solid #29303a;z-index:5}.brand{font-weight:900;letter-spacing:.5px}.pill{background:#181e26;border:1px solid #303844;border-radius:10px;padding:7px 10px;font-size:12px}.seed{display:flex;gap:6px;margin-left:auto}.seed input{width:125px;background:#0a0d12;color:#fff;border:1px solid #303844;border-radius:9px;padding:8px}.btn{background:#1a212a;color:#fff;border:1px solid #38414d;border-radius:9px;padding:8px 11px;font-weight:800;cursor:pointer}.btn:active{transform:translateY(1px)}#game{position:relative;flex:1;min-height:0}canvas{display:block;width:100%;height:100%;touch-action:none}#help{position:absolute;left:12px;bottom:12px;padding:8px 10px;border-radius:10px;background:#0b0e13cc;border:1px solid #303844;color:#b9c1cc;font-size:12px;pointer-events:none}.mobile{display:none;position:absolute;inset:auto 0 12px 0;justify-content:center;gap:70px;pointer-events:none}.pad{width:74px;height:74px;border-radius:50%;background:#111722aa;border:1px solid #68717e;color:#fff;font-size:26px;font-weight:900;pointer-events:auto;touch-action:none}.mobile .center{display:flex;gap:8px;align-items:center}.mobile .small{width:58px;height:58px;font-size:20px}@media(max-width:700px){#hud{height:auto;min-height:56px;flex-wrap:wrap}.brand{font-size:14px}.seed{margin-left:0;width:100%}.seed input{flex:1}.pill{display:none}#help{display:none}.mobile{display:flex}} 
</style>
</head>
<body>
<div id="hud">
<div class="brand">OVERTRACK</div>
<div class="pill" id="speed">0 km/h</div>
<div class="pill" id="lap">Lap 1/3</div>
<div class="pill" id="time">0:00.000</div>
<div class="seed"><input id="seedInput" placeholder="Seed"><button class="btn" id="random">Random</button><button class="btn" id="generate">Generate</button><button class="btn" id="reset">Reset</button></div>
</div>
<div id="game"><canvas id="c"></canvas><div id="help">WASD / arrows · R reset · Space handbrake · drive through the checkpoints</div><div class="mobile"><button class="pad" data-k="left">←</button><div class="center"><button class="pad small" data-k="brake">●</button><button class="pad small" data-k="gas">▲</button></div><button class="pad" data-k="right">→</button></div></div>
<script>
(()=>{"use strict";
const c=document.getElementById("c"),ctx=c.getContext("2d"),speedEl=document.getElementById("speed"),lapEl=document.getElementById("lap"),timeEl=document.getElementById("time"),seedInput=document.getElementById("seedInput");
let W=0,H=0,dpr=1,world={w:3000,h:2200,points:[],inner:[],outer:[],walls:[]},car,keys={},started=false,finish=false,elapsed=0,last=performance.now(),cam={x:0,y:0};
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=c.clientWidth;H=c.clientHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener("resize",resize);resize();
function hashSeed(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){let x=hashSeed(seed);return()=>{x^=x<<13;x^=x>>>17;x^=x<<5;return(x>>>0)/4294967296}}
function lerp(a,b,t){return a+(b-a)*t}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function makeTrack(seed){
 const r=rng(seed),n=28,pts=[];let cx=1500,cy=1100,rx=900,ry=650;
 for(let i=0;i<n;i++){let a=i/n*Math.PI*2;let wob=lerp(.82,1.18,r());pts.push({x:cx+Math.cos(a)*rx*wob,y:cy+Math.sin(a)*ry*lerp(.86,1.14,r())})}
 let smooth=[];
 for(let i=0;i<n;i++){let a=pts[(i-1+n)%n],b=pts[i],d=pts[(i+1)%n];smooth.push({x:(a.x+b.x*2+d.x)/4,y:(a.y+b.y*2+d.y)/4})}
 const outer=[],inner=[];for(let i=0;i<n;i++){let p=smooth[i],q=smooth[(i+1)%n],dx=q.x-p.x,dy=q.y-p.y,l=Math.hypot(dx,dy)||1,nx=-dy/l,ny=dx/l;outer.push({x:p.x+nx*115,y:p.y+ny*115});inner.push({x:p.x-nx*115,y:p.y-ny*115})}
 world={w:3000,h:2200,points:smooth,outer,inner,walls:[]};
 let p=smooth[0],q=smooth[1],ang=Math.atan2(q.y-p.y,q.x-p.x);car={x:p.x,y:p.y,angle:ang,speed:0,steer:0};
 elapsed=0;finish=false;started=true;cam={x:car.x,y:car.y};updateHud();
}
function poly(points){ctx.beginPath();ctx.moveTo(points[0].x,points[0].y);for(let i=1;i<points.length;i++)ctx.lineTo(points[i].x,points[i].y);ctx.closePath()}
function drawTrack(){
 ctx.fillStyle="#101317";ctx.fillRect(0,0,W,H);
 ctx.save();ctx.translate(W/2-cam.x,H/2-cam.y);
 ctx.fillStyle="#1a1e22";poly(world.outer);ctx.fill();
 ctx.fillStyle="#08744d";ctx.beginPath();for(let i=0;i<world.outer.length;i++){let p=world.outer[i];i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)}for(let i=world.inner.length-1;i>=0;i--)ctx.lineTo(world.inner[i].x,world.inner[i].y);ctx.closePath();ctx.fill();
 ctx.fillStyle="#292d32";poly(world.inner);ctx.fill();
 ctx.strokeStyle="#59616a";ctx.lineWidth=7;ctx.setLineDash([]);poly(world.outer);ctx.stroke();poly(world.inner);ctx.stroke();
 ctx.strokeStyle="#aab1b8";ctx.lineWidth=3;ctx.setLineDash([28,26]);ctx.beginPath();for(let i=0;i<world.points.length;i++){let p=world.points[i];i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)}ctx.closePath();ctx.stroke();ctx.setLineDash([]);
 drawStart();
 drawCar();
 ctx.restore();
}
function drawStart(){let p=world.points[0],q=world.points[1],a=Math.atan2(q.y-p.y,q.x-p.x),nx=-Math.sin(a),ny=Math.cos(a);ctx.save();ctx.translate(p.x,p.y);ctx.rotate(a);for(let i=-100;i<101;i+=24){ctx.fillStyle=(Math.floor((i+100)/24)%2)?"#fff":"#222";ctx.fillRect(-12,i,24,12)}ctx.restore();ctx.strokeStyle="#e9edf2";ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(p.x-nx*105,p.y-ny*105);ctx.lineTo(p.x+nx*105,p.y+ny*105);ctx.stroke()}
function drawCar(){ctx.save();ctx.translate(car.x,car.y);ctx.rotate(car.angle);ctx.shadowBlur=16;ctx.shadowColor="#000";ctx.fillStyle="#d9e1e8";ctx.fillRect(-22,-11,44,22);ctx.fillStyle="#111820";ctx.fillRect(-5,-9,18,18);ctx.fillStyle="#222";ctx.fillRect(-16,-14,9,5);ctx.fillRect(8,-14,9,5);ctx.fillRect(-16,9,9,5);ctx.fillRect(8,9,9,5);ctx.fillStyle="#e7b84a";ctx.fillRect(18,-7,4,14);ctx.restore()}
function worldPoint(sx,sy){return{x:sx-W/2+cam.x,y:sy-H/2+cam.y}}
function update(dt){
 if(!started||finish)return;
 let gas=keys.w||keys.ArrowUp,brake=keys.s||keys.ArrowDown,left=keys.a||keys.ArrowLeft,right=keys.d||keys.ArrowRight;
 let throttle=gas?1:0; if(brake)throttle=-.65;
 let max=390,acc=310;if(throttle>0)car.speed=Math.min(max,car.speed+acc*dt);else car.speed*=Math.pow(.985,dt*60);
 if(throttle<0)car.speed=Math.max(-120,car.speed+throttle*260*dt);
 let steer=(right?1:0)-(left?1:0),turn=steer*2.2*Math.min(1,Math.abs(car.speed)/120);
 car.angle+=turn*dt*(car.speed>=0?1:-1); if(keys[" "])car.speed*=Math.pow(.93,dt*60);
 car.x+=Math.cos(car.angle)*car.speed*dt;car.y+=Math.sin(car.angle)*car.speed*dt;
 let center=nearestCenter(car.x,car.y),off=Math.abs(center.d);if(off>175){car.speed*=Math.pow(.72,dt*60);car.x-=Math.cos(car.angle)*40*dt;car.y-=Math.sin(car.angle)*40*dt}
 if(dist(car,world.points[world.points.length-1])<115&&Math.abs(car.speed)>20){car.lap=(car.lap||1);let next=(car.lap||1);if(next>=3){finish=true}else{car.lap=next+1;car.x=world.points[0].x;car.y=world.points[0].y;car.angle=Math.atan2(world.points[1].y-world.points[0].y,world.points[1].x-world.points[0].x);car.speed=0}}
 elapsed+=dt;cam.x=lerp(cam.x,car.x,.12);cam.y=lerp(cam.y,car.y,.12);updateHud()
}
function nearestCenter(x,y){let best={d:1e9};for(let i=0;i<world.points.length;i++){let p=world.points[i],q=world.points[(i+1)%world.points.length],vx=q.x-p.x,vy=q.y-p.y,l=vx*vx+vy*vy,t=Math.max(0,Math.min(1,((x-p.x)*vx+(y-p.y)*vy)/l)),px=p.x+vx*t,py=p.y+vy*t,d=Math.hypot(x-px,y-py);if(d<best.d)best={d,i}}return best}
function updateHud(){speedEl.textContent=Math.round(Math.abs(car?.speed||0)*.22)+" km/h";lapEl.textContent="Lap "+(car?.lap||1)+"/3";let m=Math.floor(elapsed/60),s=(elapsed%60).toFixed(3).padStart(6,"0");timeEl.textContent=m+":"+s;if(finish)timeEl.textContent="FINISH "+m+":"+s}
function reset(){let seed=seedInput.value.trim()||"default";makeTrack(seed);car.lap=1}
function render(){drawTrack()}
function loop(now){let dt=Math.min(.035,(now-last)/1000);last=now;update(dt);render();requestAnimationFrame(loop)}
addEventListener("keydown",e=>{keys[e.key]=true;if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key))e.preventDefault();if(e.key.toLowerCase()==="r")reset()});
addEventListener("keyup",e=>keys[e.key]=false);
document.getElementById("random").onclick=()=>{seedInput.value=Math.floor(Math.random()*999999999);reset()};
document.getElementById("generate").onclick=reset;document.getElementById("reset").onclick=reset;
for(const b of document.querySelectorAll("[data-k]")){let k=b.dataset.k,map={gas:"w",brake:"s",left:"a",right:"d"};b.addEventListener("pointerdown",e=>{e.preventDefault();keys[map[k]]=true;b.setPointerCapture(e.pointerId)});b.addEventListener("pointerup",()=>keys[map[k]]=false);b.addEventListener("pointercancel",()=>keys[map[k]]=false)}
seedInput.value=Math.floor(Math.random()*999999999);reset();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
