<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Overtrack Racing</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#090b0e;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:flex;flex-direction:column}#hud{min-height:58px;display:flex;align-items:center;gap:9px;padding:8px 12px;background:#10141a;border-bottom:1px solid #29303a;z-index:5}.brand{font-weight:950;letter-spacing:.7px}.pill{background:#181e26;border:1px solid #303844;border-radius:10px;padding:7px 10px;font-size:12px}.seed{display:flex;gap:6px;margin-left:auto}.seed input{width:125px;background:#0a0d12;color:#fff;border:1px solid #303844;border-radius:9px;padding:8px}.btn{background:#1a212a;color:#fff;border:1px solid #38414d;border-radius:9px;padding:8px 11px;font-weight:800;cursor:pointer}#game{position:relative;flex:1;min-height:0}canvas{display:block;width:100%;height:100%;touch-action:none}#help{position:absolute;left:12px;bottom:12px;padding:8px 10px;border-radius:10px;background:#0b0e13cc;border:1px solid #303844;color:#b9c1cc;font-size:12px;pointer-events:none}.mobile{display:none;position:absolute;inset:auto 0 12px;justify-content:center;gap:65px;pointer-events:none}.pad{width:74px;height:74px;border-radius:50%;background:#111722aa;border:1px solid #68717e;color:#fff;font-size:26px;font-weight:900;pointer-events:auto;touch-action:none}.mobile .center{display:flex;gap:8px;align-items:center}.mobile .small{width:58px;height:58px;font-size:20px}@media(max-width:700px){#hud{flex-wrap:wrap}.brand{font-size:14px}.pill{display:none}.seed{margin-left:0;width:100%}.seed input{flex:1}#help{display:none}.mobile{display:flex}}
</style>
</head>
<body>
<div id="hud"><div class="brand">OVERTRACK</div><div class="pill" id="type">RALLY</div><div class="pill" id="speed">0 km/h</div><div class="pill" id="progress">0%</div><div class="pill" id="time">0:00.000</div><div class="seed"><input id="seedInput" placeholder="Seed"><button class="btn" id="random">Random</button><button class="btn" id="generate">Generate</button><button class="btn" id="reset">Reset</button></div></div>
<div id="game"><canvas id="c"></canvas><div id="help">WASD / arrows · Space = handbrake drift · R reset · finish the route without teleporting</div><div class="mobile"><button class="pad" data-k="left">←</button><div class="center"><button class="pad small" data-k="brake">●</button><button class="pad small" data-k="gas">▲</button></div><button class="pad" data-k="right">→</button></div></div>
<script>
(()=>{"use strict";
const c=document.getElementById("c"),ctx=c.getContext("2d"),speedEl=document.getElementById("speed"),progressEl=document.getElementById("progress"),timeEl=document.getElementById("time"),typeEl=document.getElementById("type"),seedInput=document.getElementById("seedInput");
let W=0,H=0,dpr=1,world,car,keys={},elapsed=0,last=performance.now(),cam={x:0,y:0};
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=c.clientWidth;H=c.clientHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener("resize",resize);resize();
function hashSeed(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){let x=hashSeed(seed)||123456789;return()=>{x^=x<<13;x^=x>>>17;x^=x<<5;return(x>>>0)/4294967296}}
function makeTrack(seed){
 const r=rng(seed),rally=r()<.58,n=rally?90:42,pts=[];
 if(rally){
  let x=500,y=1100,a=-.05;pts.push({x,y});
  for(let i=1;i<n;i++){a+=(-.6+r()*1.2);let len=75+r()*95;x+=Math.cos(a)*len;y+=Math.sin(a)*len;if(y<250){y=250;a=Math.abs(a)+.2}if(y>1950){y=1950;a=-Math.abs(a)-.2}pts.push({x,y})}
 }else{
  let cx=2100,cy=1200,rx=1500,ry=850;
  for(let i=0;i<n;i++){let a=i/n*Math.PI*2,w=.8+r()*.4;pts.push({x:cx+Math.cos(a)*rx*w,y:cy+Math.sin(a)*ry*(.82+r()*.36)})}
 }
 let smooth=[];
 for(let i=0;i<n;i++){let a=pts[Math.max(0,i-1)],b=pts[i],d=pts[Math.min(n-1,i+1)];smooth.push({x:(a.x+b.x*2+d.x)/4,y:(a.y+b.y*2+d.y)/4})}
 if(!rally)smooth[n-1]=smooth[0];
 const outer=[],inner=[],width=rally?92:125;
 for(let i=0;i<n-(rally?1:0);i++){let p=smooth[i],q=smooth[(i+1)%n],dx=q.x-p.x,dy=q.y-p.y,l=Math.hypot(dx,dy)||1,nx=-dy/l,ny=dx/l;outer.push({x:p.x+nx*width,y:p.y+ny*width});inner.push({x:p.x-nx*width,y:p.y-ny*width})}
 world={points:smooth,outer,inner,rally,n};
 let p=smooth[0],q=smooth[1];car={x:p.x,y:p.y,angle:Math.atan2(q.y-p.y,q.x-p.x),vx:0,vy:0,speed:0,progress:0,lap:1,finished:false};
 elapsed=0;cam={x:car.x,y:car.y};typeEl.textContent=rally?"RALLY":"CIRCUIT";updateHud();
}
function poly(a){ctx.beginPath();ctx.moveTo(a[0].x,a[0].y);for(let i=1;i<a.length;i++)ctx.lineTo(a[i].x,a[i].y);ctx.closePath()}
function centerLine(){ctx.beginPath();for(let i=0;i<world.points.length;i++){let p=world.points[i];i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)}if(!world.rally)ctx.closePath();ctx.stroke()}
function drawTrack(){
 ctx.fillStyle=world.rally?"#20251f":"#15191d";ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(W/2-cam.x,H/2-cam.y);
 if(world.rally){ctx.fillStyle="#4b5047";ctx.fillRect(-500,-100,6500,2400);ctx.fillStyle="#343832";poly(world.outer);ctx.fill();ctx.strokeStyle="#d1c79c";ctx.lineWidth=5;poly(world.outer);ctx.stroke();poly(world.inner);ctx.stroke();ctx.strokeStyle="#ece4c5";ctx.lineWidth=3;ctx.setLineDash([20,30]);centerLine();ctx.setLineDash([])}
 else{ctx.fillStyle="#22272b";poly(world.outer);ctx.fill();ctx.fillStyle="#08734d";ctx.beginPath();for(let i=0;i<world.outer.length;i++){let p=world.outer[i];i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)}for(let i=world.inner.length-1;i>=0;i--){let p=world.inner[i];ctx.lineTo(p.x,p.y)}ctx.closePath();ctx.fill();ctx.fillStyle="#30353a";poly(world.inner);ctx.fill();ctx.strokeStyle="#68717a";ctx.lineWidth=7;poly(world.outer);ctx.stroke();poly(world.inner);ctx.stroke();ctx.strokeStyle="#b5bcc3";ctx.lineWidth=3;ctx.setLineDash([28,26]);centerLine();ctx.setLineDash([])}
 drawMarkers();drawCar();ctx.restore()
}
function drawMarkers(){
 let p=world.points[0],q=world.points[1],a=Math.atan2(q.y-p.y,q.x-p.x),nx=-Math.sin(a),ny=Math.cos(a);
 ctx.strokeStyle="#fff";ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(p.x-nx*100,p.y-ny*100);ctx.lineTo(p.x+nx*100,p.y+ny*100);ctx.stroke();
 if(world.rally){let end=world.points[world.points.length-1];ctx.fillStyle="#f2d36b";ctx.beginPath();ctx.arc(end.x,end.y,22,0,Math.PI*2);ctx.fill();ctx.fillStyle="#15191d";ctx.font="bold 14px system-ui";ctx.textAlign="center";ctx.fillText("FINISH",end.x,end.y-30)}
}
function drawCar(){ctx.save();ctx.translate(car.x,car.y);ctx.rotate(car.angle);ctx.shadowBlur=18;ctx.shadowColor="#000";ctx.fillStyle="#e2e8ed";ctx.fillRect(-26,-12,52,24);ctx.fillStyle="#17212a";ctx.fillRect(-4,-10,20,20);ctx.fillStyle="#17191b";ctx.fillRect(-19,-15,10,6);ctx.fillRect(9,-15,10,6);ctx.fillRect(-19,9,10,6);ctx.fillRect(9,9,10,6);ctx.fillStyle="#f1c84d";ctx.fillRect(22,-7,5,14);ctx.restore()}
function nearest(x,y){let best={d:1e9,t:0,i:0};let end=world.rally?world.points.length-1:world.points.length;for(let i=0;i<end;i++){let p=world.points[i],q=world.points[(i+1)%world.points.length],vx=q.x-p.x,vy=q.y-p.y,l=vx*vx+vy*vy||1,t=Math.max(0,Math.min(1,((x-p.x)*vx+(y-p.y)*vy)/l)),px=p.x+vx*t,py=p.y+vy*t,d=Math.hypot(x-px,y-py);if(d<best.d)best={d,t,i}}return best}
function update(dt){
 if(car.finished)return;
 let gas=keys.w||keys.ArrowUp,brake=keys.s||keys.ArrowDown,left=keys.a||keys.ArrowLeft,right=keys.d||keys.ArrowRight,hand=keys[" "];
 let throttle=gas?1:0;if(brake)throttle=-.6;
 let fx=Math.cos(car.angle),fy=Math.sin(car.angle),rx=-fy,ry=fx;
 let forward=car.vx*fx+car.vy*fy,lateral=car.vx*rx+car.vy*ry;
 const max=world.rally?900:780,acc=world.rally?470:420;
 if(throttle>0)forward+=acc*dt;else forward*=Math.pow(.997,dt*60);
 if(throttle<0)forward-=330*dt;
 forward=Math.max(-150,Math.min(max,forward));
 let steer=(right?1:0)-(left?1:0);
 if(Math.abs(forward)>20)car.angle+=steer*(hand?2.9:2.15)*Math.min(1,Math.abs(forward)/180)*dt*(forward>=0?1:-1);
 let grip=hand?1.25:(world.rally?4.2:6.8);
 lateral*=Math.pow(Math.max(.01,1-grip*dt),1);
 if(Math.abs(steer)>0&&Math.abs(forward)>180)lateral+=steer*forward*(hand?.38:.10)*dt;
 car.vx=fx*forward+rx*lateral;car.vy=fy*forward+ry*lateral;car.x+=car.vx*dt;car.y+=car.vy*dt;car.speed=Math.hypot(car.vx,car.vy);
 let near=nearest(car.x,car.y),limit=world.rally?135:185;
 if(near.d>limit){let slow=Math.max(.12,1-(near.d-limit)/120);car.vx*=Math.pow(slow,dt*60);car.vy*=Math.pow(slow,dt*60)}
 let target=near.i+near.t;
 if(world.rally){car.progress=Math.max(car.progress,Math.min(1,target/(world.points.length-1)));if(car.progress>.995&&near.d<limit)car.finished=true}
 else{let total=world.points.length,cur=(target+total)%total;if(Math.hypot(car.x-world.points[0].x,car.y-world.points[0].y)<60&&car.progress>.8&&car.speed>50){car.lap++;car.progress=0;if(car.lap>3)car.finished=true}else car.progress=Math.max(car.progress,cur/total)}
 elapsed+=dt;cam.x=lerp(cam.x,car.x,.1);cam.y=lerp(cam.y,car.y,.1);updateHud()
}
function lerp(a,b,t){return a+(b-a)*t}
function updateHud(){speedEl.textContent=Math.round(car.speed*.22)+" km/h";progressEl.textContent=world.rally?Math.round(car.progress*100)+"%":"Lap "+Math.min(car.lap,3)+"/3";let m=Math.floor(elapsed/60),s=(elapsed%60).toFixed(3).padStart(6,"0");timeEl.textContent=car.finished?"FINISH "+m+":"+s:m+":"+s}
function reset(){makeTrack(seedInput.value.trim()||"default")}
function loop(now){let dt=Math.min(.03,(now-last)/1000);last=now;update(dt);drawTrack();requestAnimationFrame(loop)}
addEventListener("keydown",e=>{keys[e.key]=true;if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key))e.preventDefault();if(e.key.toLowerCase()==="r")reset()});addEventListener("keyup",e=>keys[e.key]=false);
document.getElementById("random").onclick=()=>{seedInput.value=Math.floor(Math.random()*999999999);reset()};document.getElementById("generate").onclick=reset;document.getElementById("reset").onclick=reset;
for(const b of document.querySelectorAll("[data-k]")){const map={gas:"w",brake:"s",left:"a",right:"d"};b.addEventListener("pointerdown",e=>{e.preventDefault();keys[map[b.dataset.k]]=true;b.setPointerCapture(e.pointerId)});b.addEventListener("pointerup",()=>keys[map[b.dataset.k]]=false);b.addEventListener("pointercancel",()=>keys[map[b.dataset.k]]=false)}
seedInput.value=Math.floor(Math.random()*999999999);reset();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
